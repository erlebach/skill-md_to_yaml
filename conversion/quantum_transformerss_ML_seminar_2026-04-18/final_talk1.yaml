layout: divider
title: "Part 4 — Shots: Sampling Quantum Outputs"
---

---
layout: content
title: "Why shots, and NISQ vs FTQC in one picture"
---
- Measurement is **probabilistic**; states are **destroyed**; **repetition** is not a hardware quirk
- $S_{\text{NISQ}} = S_{\text{stats}} \times S_{\text{mit}}$, while **FTQC** removes mitigation overhead: $S_{\text{FTQC}} \approx S_{\text{stats}}$
- Examples (order-of-magnitude): simple 1Q circuits $\sim$ thousands of shots; **NISQ** on tens of qubits can demand **$10^4$+**; **FTQC** trends toward the **statistical** floor; **very deep** NISQ can become intractable

---
layout: divider
title: "Part 5 — From Classical SVD to QSVT"
---

---
layout: content
title: SVD, singular values, and the quantum target
---
- **SVD:** $A = U \Sigma V^\dagger$; singular values $\sigma_i$ 
- **Use cases:** low-rank truncation, attention on $QK^T$; goal is to apply a **function** to $\Sigma$ without forming dense $A$
- **Quantum target:** $p(\Sigma)$ via **QSP/QSVT** in **$O(d_{\text{poly}})$** calls to a **block-encoded** $A/\alpha$ — not $O(N^2)$ classical linear algebra
- **Block encoding** gives $U_A$; **QSP** interleaves $U_A$ with **$Z$-rotations**; **QSVT** implements $p(\Sigma)$ on two registers

---
layout: content
title: "QSP / QSVT — what you compile"
---
$$(\langle 0|^{\otimes a} \otimes I_n)\; U_A\; (|0\rangle^{\otimes a} \otimes I_n) = \frac{A}{\alpha}$$

- **QSP:** phases $\{e^{i\phi_k Z}\}$ with $U_A$ realize **bounded** polynomials $p(\sigma)$ on $[-1,1]$, degree $d$ $\Rightarrow$ $O(d)$ **oracle** depth
- **Classical** phase solving (QSPPACK, pyqsp) + **FTQC T-count** for sparse $A$: often **$O(d\,\text{poly}\log N)$** vs $N^2$ dense work

$$\text{QSVT of degree } d \text{ uses } O(d) \text{ block-encoded } U_A \text{ applications}$$

