---
layout: content
title: "Activations: not cosmetic for QSVT"
---
- **GELU, softmax** (entire) $\Rightarrow$ $d = O(\log(1/\varepsilon))$ targets
- **ReLU** $\Rightarrow$ $d = O(1/\varepsilon)$ in worst **uniform** approximations — can erase asymptotic advantage for small $\varepsilon$

---
layout: content
title: Polylog depth in sequence length (QLA view)
---
- **Doubling** $n$ can leave depth **$(\log n)^k$**-like under **encoding + oracle** models — **not** $n$ or $n^2$ for the *idealized* pipeline
- **Classical** attention is typically **$O(n^2)$** (often $O(n^2 d)$) work
- **Caveat:** these claims are **assumption-heavy** (access, **FTQC**, **bounded** subnormalization)

