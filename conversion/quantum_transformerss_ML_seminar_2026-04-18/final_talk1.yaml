layout: content
title: "Two Regimes: Attention vs FFN"
---
$$\text{FLOPs}_{\text{attn}} = O(Sd^2 + S^2d), \qquad \text{FLOPs}_{\text{FFN}} = 8Sd^2$$
- **$Sd^2$** vs **$S^2d$** in attention: for GPT-3 ($d \approx 12{,}288$) crossover near $S \approx 2d$; **$128$k+** contexts are deep in the **$S^2d$** regime
- **FFN** has **no** $S^2$; it dominates only when $d \gg S$ — **not** typical for long-context LLMs

