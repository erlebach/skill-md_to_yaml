---
layout: summary
title: "Summary — Quantum Transformers"
subtitle: "What to remember"
content_scale: 0.9
---
- **Classical:** attention is **$O(S^2 d)$** in the long-context regime; FFN is **$O(Sd^2)$**
- **FTQC+QSVT:** **analytic** activations and spectra enable **$O(\log(1/\varepsilon))$**-degree / depth targets 
    - **$\alpha$** and **oracle T-count** matter
- **Polylog in $n$** is a **separate** story from **$\varepsilon$**; 
    - both need **QRAM/structured access** and honest **NISQ** (depth/width/ancilla) accounting
- **Reality check:** **QRAM**, **LayerNorm**, **shot budgets**, and **dequantization**-style limits can **invalidate** a polylog claim in practice
- **Polylog scaling:** costs like **$(\log n)^k$** in idealized QLA writeups; 
    - **caveat:** strongest statements are **theoretical** and long-run **hardware**-dependent


