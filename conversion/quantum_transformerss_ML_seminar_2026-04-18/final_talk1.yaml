---
layout: content
title: Why more ancillae? (reality)
---
- **LCU:** a sum of $L$ unitaries needs $\lceil \log_2 L \rceil$ **indexing** ancillae (e.g. 100 terms → 7)
- **Tighter $\alpha$** often **costs depth and ancillae**; **sparse** oracles: $O(\log N + \log d)$ address ancillae
- **Practical $a$:** often **5–15**; watch **width vs depth** tradeoffs (NISQ: noise vs routing)

