layout: divider
title: "Part 6 — Poly-Logarithmic Depth and Polylog in $n$"
---

---
layout: content
title: "What $O(\\text{poly}\\log(1/\\varepsilon))$ buys you"
---
- **QSVT** targets **precision** $\varepsilon$ with **degree** $d = O(\log^k(1/\varepsilon))$ for **analytic** $f$ on $[-1,1]$
- Contrast: $O(1/\varepsilon^2)$ and $O(1/\varepsilon)$ are **huge** at $\varepsilon=10^{-6}$; **$\log$**-scaling is the feasible regime
- **Depth = degree** in standard QSP counting (up to constant factors in oracle and amplification)

---
layout: content
title: "Chebyshev, analyticity, and solving for degree"
---
- **Analytic** $f$ (strip in $\mathbb{C}$) $\Rightarrow$ **exponential** Chebyshev decay: error $\le C r^{-d}$, $r>1$
- Solving $C r^{-d} \le \varepsilon$ gives **$d = O(\log(1/\varepsilon))$**; **GELU / softmax** (entire) are friendly; **ReLU** (non-analytic at 0) is **not**
- **Hidden** factors: subnormalization **$\alpha$** and oracle costs often dominate in practice

---
