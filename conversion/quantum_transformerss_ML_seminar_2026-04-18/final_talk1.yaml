layout: divider
title: "Part 3 — Block Encoding: Embedding Non-Unitary Matrices"
---

---
layout: content
title: "Block encodings, ancillae, and subnormalization"
---
- **Unitary constraint:** $U_A$ on $n{+}a$ qubits; attention / weight matrices are **not** unitary; embed $A$ in a corner and **post-select** ancillae
- **Embedding:** $(\langle 0|^{\otimes a} \otimes I) U_A (|0\rangle^{\otimes a} \otimes I) = A/\alpha$ with **$\alpha \ge \|A\|$** (singular values in $[0,1]$ in the block)
- **Hilbert space:** each ancilla **doubles** book-keeping; $A/\alpha$ sits in a **$2^n \times 2^n$** block inside $2^{n+a}\times2^{n+a}$ unitary
- **Post-selection:** success $\sim 1/\alpha^2$; amplitude amplification can restore $O(1)$ at **$O(\alpha)$** extra cost

