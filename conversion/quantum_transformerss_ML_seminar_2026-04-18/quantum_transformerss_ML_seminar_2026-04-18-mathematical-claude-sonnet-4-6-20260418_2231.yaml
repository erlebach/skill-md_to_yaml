---
layout: content
title: "Costs 3–4 — Shots and Circuit Evaluation"
skip: true
---
- **Shots (attention weights as expectation values):**

$$S \geq \frac{1}{2\varepsilon^2} \ln\!\left(\frac{2}{\delta}\right)$$

For $\varepsilon = 0.01$, $\delta = 0.01$: $S \approx 26{,}500$ shots; times $S$ tokens: $O(S/\varepsilon^2)$ total

- **Circuit evaluation:** T-gate count per shot:

$$\text{Cost}_{\text{circuit}} = d_{\text{poly}} \times T_{\text{gate}}(U_A) = O\!\left(\log(1/\varepsilon) \cdot d \cdot \text{poly}(\log S)\right)$$

- Compare to classical $O(S^2 d)$ — quantum wins only if QRAM available, attention $d$-sparse, and shot overhead manageable

