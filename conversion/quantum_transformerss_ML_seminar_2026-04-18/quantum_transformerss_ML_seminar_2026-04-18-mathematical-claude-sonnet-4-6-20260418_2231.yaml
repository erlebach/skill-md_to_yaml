---
layout: divider
title: "Part 9 — Quantum FFN: Full Treatment"
---

---
layout: content
title: Classical FFN — Two Linear Layers with Nonlinear Activation
---
$$\text{FFN}(\mathbf{x}) = W_2\,\sigma(W_1\mathbf{x} + \mathbf{b}_1) + \mathbf{b}_2, \quad W_1 \in \mathbb{R}^{4d \times d},\; W_2 \in \mathbb{R}^{d \times 4d}$$

- Cost per token: $4d^2$ (first layer) + $O(d)$ (activation) + $4d^2$ (second layer) $= O(d^2)$
- Over $S$ tokens: $\text{FLOPs}_{\text{FFN}} = 8Sd^2$ — no $S^2$ term
- FFN dominates total cost only when $d \gg S/4$ — **not** the case for modern LLMs with long context
- **Quantum target:** replace $O(d^2)$ per token with $O(\text{poly}\log d)$ under QRAM + bounded-$\alpha$

---
layout: content
title: "Step 1 — Block-Encoding $W_1$ and $W_2$"
skip: true
---
$$U_{W_1}: \quad (\langle 0|^{\otimes a_1} \otimes I_n)\; U_{W_1}\; (|0\rangle^{\otimes a_1} \otimes I_n) = \frac{W_1}{\alpha_1}$$

- $\alpha_1 \geq \|W_1\|$; $a_1 = \lceil \log_2 \alpha_1 \rceil$ ancilla qubits; analogously $\alpha_2, U_{W_2}$ for $W_2$
- Trained weight matrices have bounded spectral norm by implicit regularization: $\alpha = O(\text{poly}(d))$, contributing $O(\log d)$ ancillae
- Dense $4d \times d$ matrices ($s = d$): $O(d \cdot \text{poly}(\log d))$ T-gates per application

---
layout: content
title: "Step 2 — Activation via QSVT: Spectral vs Elementwise"
skip: true
---
- Softmax in attention acts on **singular values** of the score matrix — exactly the QSVT spectral setting
- The FFN activation $\sigma$ acts **elementwise** on the post-linear vector — a different primitive
- **Solution:** embed elementwise operation as diagonal matrix $D = \text{diag}(c_0, c_1, \ldots, c_{d-1})$
    - Singular values of $D$ are precisely $|c_i|$, so QSVT applies directly
    - GELU: entire function; $d_{\text{GELU}} = O(\log(1/\varepsilon))$
    - ReLU: involves $|x|$, not analytic at 0; $d_{\text{ReLU}} = O(1/\varepsilon)$

