---
layout: content
title: "Step 3 — Sequential Composition and Amplitude Amplification"
---
- Three sequential QSVT circuits: $U_{W_1}$, then $U_\sigma$, then $U_{W_2}$
- Each post-selection succeeds with probability $\sim 1/\alpha^2$; three sequential post-selections compound:

$$P(\text{success}) \sim \frac{1}{\alpha_1^2 \cdot \alpha_\sigma^2 \cdot \alpha_2^2}$$

- **Amplitude amplification** (Grover reflections) boosts to $O(1)$ at cost $O(\alpha)$ extra circuit repetitions:

$$T_{\text{FFN}} = O\!\left(\alpha_1 \cdot \alpha_\sigma \cdot \alpha_2 \cdot \log(1/\varepsilon) \cdot \text{poly}(\log d)\right)$$

- The $\alpha$ factors are the "hidden constants" that complexity analyses routinely suppress

---
layout: content
title: "Step 4 — Bias Terms via LCU"
skip: true
---
- Classical affine map $\mathbf{x} \mapsto W\mathbf{x} + \mathbf{b}$ must be block-encoded
- **LCU technique:** $W\mathbf{x} + \mathbf{b} = \sum_k \lambda_k U_k|\psi\rangle$
- Requires $\lceil \log_2 L \rceil$ ancillae to index $L$ terms; adds $\|\boldsymbol{\lambda}\|_1 = \sum_k |\lambda_k|$ to subnormalization
- For bias addition: $L = 2$ terms — mild overhead, but a real contribution to ancilla count and total $\alpha$

