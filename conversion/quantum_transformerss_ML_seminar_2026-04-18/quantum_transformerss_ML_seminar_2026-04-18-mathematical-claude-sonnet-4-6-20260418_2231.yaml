---
layout: content
title: "Adding Ancilla Qubits Expands the Hilbert Space"
---
- When $A$ is **non-unitary**, we must embed it into a larger unitary $U_A$ by adding ancilla qubits
- Each ancilla qubit **doubles** the total Hilbert space: $n$ system qubits + $a$ ancilla qubits → matrix size $2^{n+a} \times 2^{n+a}$
- $A/\alpha$ occupies only the top-left $2^n \times 2^n$ corner — the rest of $U_A$ is filled to enforce unitarity
- **Post-selecting** the ancilla on $|0\rangle$ projects onto that top-left corner, effectively applying $A/\alpha$

