## Summary
- Every matrix $A \in \mathbb{C}^{m \times n}$ admits: $A = U \Sigma V^\dagger$

//## Properties
//- $U$, $V$ unitary (rotations); $\Sigma$ diagonal with singular values $\sigma_1 \geq \sigma_2 \geq \cdots \geq \sigma_r \geq 0$
//- **Geometric reading:** $V^\dagger$ rotates input to right singular vector basis; $\Sigma$ stretches along those axes; $U$ rotates result to output basis
