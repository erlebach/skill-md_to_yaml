---
layout: content
title: Why Singular Values Are the Right Quantum Target
---
- **Low-rank approximation:** keep only the $k$ largest singular values — best rank-$k$ approximation (Eckart–Young)
- **Pseudoinverse:** $A^+ = V \Sigma^+ U^\dagger$ — replace each $\sigma_i$ with $1/\sigma_i$ for nonzero values
- **Attention scores** $QK^T$ have a natural SVD — singular values encode the strength of each attention pattern
- **Quantum advantage target:** rather than computing $A$ explicitly at cost $O(S^2 d)$, apply a **polynomial function** $p(\Sigma)$ to all singular values **simultaneously** in $O(\text{poly}\log)$ depth

---
layout: proof
title: "Block Encoding Enables QSVT — The Key Identity"
---
$$(\langle 0|^{\otimes a} \otimes I_n)\; U_A\; (|0\rangle^{\otimes a} \otimes I_n) = \frac{A}{\alpha}$$

- $U_A$ is a **unitary** — a valid quantum gate on $n + a$ qubits
- $\alpha \geq \|A\|$ ensures singular values of $A/\alpha$ lie in $[0,1]$
- Post-selecting ancilla on $|0\rangle$: system register holds $A|\psi\rangle/\alpha$
- **Success probability:** $\sim 1/\alpha^2$ — amplitude amplification boosts to $O(1)$ at cost $O(\alpha)$
- **Circuit size:** for $d$-sparse $A$, compile $U_A$ in $O(d \cdot \text{poly}(\log N))$ T-gates — exponentially fewer than $N^2$ entries

