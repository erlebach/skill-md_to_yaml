layout: divider
title: "Part 4 — Shots: Sampling Quantum Outputs"
---

---
layout: content
title: Why Shots Are Necessary — Quantum Measurement Is Probabilistic
---
- Measuring $|\psi\rangle = \alpha|0\rangle + \beta|1\rangle$ yields 0 with probability $|\alpha|^2$ and 1 with probability $|\beta|^2$ 
- The state is **destroyed**
- You must re-run the circuit to reconstruct the distribution — this is **not** a hardware limitation, it is a **law of quantum mechanics**

$$\color{cyan}S_{\text{NISQ}} = S_{\text{stats}} \times S_{\text{noise mitigation}}, \qquad S_{\text{FTQC}} = S_{\text{stats}}$$

- FTQC noise-mitigation; the statistical floor remains in both eras

