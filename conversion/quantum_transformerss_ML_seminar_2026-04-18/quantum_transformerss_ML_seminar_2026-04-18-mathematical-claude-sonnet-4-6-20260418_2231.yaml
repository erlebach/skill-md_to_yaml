proportion: 50/50
right:
  type: figure
  src: _page_0_decoder_Figure_2.jpg
  alt_text: "Block diagram of the Transformer decoder-only architecture. The decoder stack (Nx) adds Masked Multi-Head Attention, cross Multi-Head Attention attending to encoder output, then Feed Forward, Linear, and Softmax to produce output probabilities."
---
- Most large language models (GPT, Gemini, Claude) are **decoder-only** Transformers
- Each **Transformer block** contains two sub-blocks:
    - **Sub-block 1:** Layer Norm → Multi-Head Attention (MHA) → Layer Norm
    - **Sub-block 2:** Layer Norm → Feed-Forward Network (FFN) → Layer Norm
- Residual connections bypass each sub-block: output = input + sub-block(input)
- We assume a **single attention head** throughout this talk for clarity

---
layout: content
title: Notation
---
- $S$ — context length (sequence length)
- $d$ — embedding dimension (constant across all $L$ layers)
- $L$ — number of Transformer blocks
- $W^Q, W^K, W^V \in \mathbb{R}^{d \times d}$ — query, key, value projection matrices
- $W^O \in \mathbb{R}^{d \times d}$ — output projection matrix
- $W_1 \in \mathbb{R}^{4d \times d},\; W_2 \in \mathbb{R}^{d \times 4d}$ — FFN weight matrices (expansion factor 4)
- Memory per block: $O(S^2 d + S d^2)$ for attention; $O(d^2)$ for FFN weights

---
layout: proof
title: "Classical Attention FLOPs — Derivation"
---
- **Projections $Q, K, V$:** each costs $S \cdot d \cdot d = Sd^2$; total for three: $3Sd^2$
- **Score matrix $QK^T$:** $Q \in \mathbb{R}^{S \times d}$ times $K^T \in \mathbb{R}^{d \times S}$ — each of $S^2$ entries is a length-$d$ dot product: cost $S^2 d$
- **Softmax:** elementwise on $S \times S$ — $O(S^2)$, subdominant for $d > 1$
- **Context $\text{softmax}(\cdot)\cdot V$:** $(S \times S)$ times $(S \times d)$ — cost $S^2 d$
- **Output projection $W^O$:** cost $Sd^2$

$$\text{FLOPs}_{\text{attn}} = O(Sd^2 + S^2d)$$

---
layout: content
title: "Attention FLOPs: Two Regimes"
---
$$\text{FLOPs}_{\text{attn}} = O(\underbrace{Sd^2}_{\text{projection cost}} + \underbrace{S^2d}_{\text{score cost}})$$

- **$Sd^2$ dominates when $d \gg S$:** wide model, short context
- **$S^2d$ dominates when $S \gg d$:** long context — the regime quantum attention targets
- **Crossover at $S = 2d$:** for GPT-3 ($d = 12{,}288$) this is $S \approx 24{,}600$ tokens
- Modern LLMs with $S = 128{,}000$ to $1{,}000{,}000$ tokens are deep in the $S^2 d$ regime

---
layout: proof
title: "Classical FFN FLOPs — Derivation"
skip: true
---
$$\text{FFN}(\mathbf{x}) = W_2\,\sigma(W_1\mathbf{x} + \mathbf{b}_1) + \mathbf{b}_2$$

- **First linear layer $W_1$:** $X \in \mathbb{R}^{S \times d}$, $W_1 \in \mathbb{R}^{4d \times d}$ — cost $4d^2$ per token; over $S$ tokens: $4Sd^2$
- **Activation $\sigma$:** elementwise on $\mathbb{R}^{S \times 4d}$ — cost $O(Sd)$, subdominant
- **Second linear layer $W_2$:** input in $\mathbb{R}^{S \times 4d}$, $W_2 \in \mathbb{R}^{d \times 4d}$ — cost $4Sd^2$

$$\text{FLOPs}_{\text{FFN}} = 8Sd^2$$

---
layout: content
title: "FFN FLOPs: Pure Quadratic in $d$, Linear in $S$"
---
$$\text{FLOPs}_{\text{FFN}} = 8Sd^2$$

- The expansion factor 4 appears **twice** ($d \to 4d$ then $4d \to d$), giving the factor of 8
- **No $S^2$ term** — FFN cost grows with $S$ only linearly; attention grows quadratically
- **Full block:** $\text{FLOPs}_{\text{block}} = 12Sd^2 + 2S^2d$; over $L$ layers: $L(12Sd^2 + 2S^2d)$
- Layer Norm costs $O(Sd)$ per block — negligible for large $d$

