---
layout: divider
title: "Part 8 — Complete Cost Model"
---

---
layout: content
title: Four Cost Components — All Must Be Accounted For
---
- The literature typically quotes **circuit evaluation cost only** — the most optimistic number
- Complete cost = Readin $\times$ Shots $\times$ Circuit evaluation, plus Readout
    1. **Readin:** loading classical data into quantum superposition — QRAM dependent
    2. **Readout:** extracting classical results — no-cloning limits what is extractable
    3. **Shots:** number of circuit repetitions — Hoeffding or reliability bound
    4. **Circuit evaluation:** T-gate count per shot — poly-log depth times T-gates per oracle call

---
layout: content
title: "Cost 1 — Readin: The QRAM Problem"
skip: true
---
- Loading $\mathbf{x} \in \mathbb{R}^N$ into $|\psi\rangle = \sum_i x_i|i\rangle$ naively requires $O(N)$ operations
- **QRAM proposed:** $\text{QRAM}: \sum_i \alpha_i|i\rangle|0\rangle \to \sum_i \alpha_i|i\rangle|x_i\rangle$ in $O(\log N)$ time
- **Reality:** no large-scale QRAM prototype; every tree node is a decoherence source; error-correction requirements orders of magnitude beyond current capability
- **Every quantum ML speedup claim that beats classical methods is load-bearing on QRAM** — without it, readin is $O(N)$ and the speedup vanishes

---
layout: content
title: "Cost 2 — Readout: The No-Cloning Barrier"
skip: true
---
- One measurement of $|\psi\rangle = \sum_i \alpha_i|i\rangle$ yields **one sample** from $\{|\alpha_i|^2\}$ — destroys the state
- Full state tomography costs $O(N/\varepsilon^2)$ — exponential in register size, infeasible at scale
- **Practical readout types:**
    - Single bitstring (Shor's, Grover's): $\approx 40$ shots for failure prob $\delta = 10^{-12}$
    - Expectation value $\langle O \rangle$: Hoeffding gives $O(1/\varepsilon^2)$ shots
    - Full token distribution ($V \approx 100{,}000$): $O(V)$ shots — quantum transformer must **sample**, not return the full distribution

