---
layout: content
title: "QSP Theorem — Polynomial Functions on Singular Values"
---
- **QSP Theorem:** by interleaving $U_A$ with single-qubit phase rotations $\{e^{i\phi_k Z}\}$, any **odd or even polynomial** $p(\sigma)$ with $|p(\sigma)| \leq 1$ on $[-1,1]$ is applied to all singular values simultaneously
- Phase angles $\{\phi_k\}$ are pre-computed classically (tools: QSPPACK, pyqsp) — the **compilation step**
- **Circuit depth:** $O(d_{\text{poly}})$ where $d_{\text{poly}}$ is the polynomial degree
- **QSVT** generalizes QSP to the full two-register setting: implements $p(\Sigma)$ coherently

$$\text{QSVT of degree } d \text{ implements } p(\Sigma) \text{ in } O(d) \text{ block-encoded oracle calls}$$

