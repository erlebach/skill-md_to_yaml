layout: divider
title: "Part 3 — Block Encoding: Embedding Non-Unitary Matrices"
---

---
layout: content
title: The Fundamental Problem — Quantum Gates Must Be Unitary
---
- A quantum gate $U$ acting on $n$ qubits must be **unitary**: $U^\dagger U = I$
- Matrices of interest — attention weights, FFN weight matrices $W_1, W_2$ — are **not unitary**
- **Solution:** embed $A$ into the top-left corner of a larger unitary $U_A$:

$$(\langle 0|^{\otimes a} \otimes I_n)\; U_A\; (|0\rangle^{\otimes a} \otimes I_n) = \frac{A}{\alpha}$$

- $a$ = number of ancilla qubits; $\alpha \geq \|A\|$ is the subnormalization factor
- Subnormalization ensures all singular values of $A/\alpha$ lie in $[0,1]$ — the valid quantum amplitude range
- **Post-selection:** measuring ancilla $= |0\rangle$ collapses the system register to $A|\psi\rangle/\alpha$

