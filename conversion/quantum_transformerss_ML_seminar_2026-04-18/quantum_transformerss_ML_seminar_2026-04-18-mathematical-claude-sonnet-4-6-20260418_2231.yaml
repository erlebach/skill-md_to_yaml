---
layout: content
title: "QSVD and the GUO Dependency Chain"
---
- **QSVD** uses QSVT with $p(\sigma)$ designed to project onto singular vectors — producing coherent states $|v_i\rangle$, $|u_i\rangle$ weighted by singular values
- The complete dependency chain:
    - **Classical SVD** → singular values $\{\sigma_i\}$ are intrinsic amplitudes
        - **Block encoding** → embeds $A/\alpha$ in unitary $U_A$; post-selection extracts $A|\psi\rangle/\alpha$
            - **QSP** → phase rotations implement any bounded polynomial $p(\sigma)$ on all $\sigma_i$ in $O(d)$ depth
                - **QSVT** → two-register generalization implementing $p(\Sigma)$ coherently
                    - **QSVD** → project onto singular vectors via QSVT
                        - **GUO Transformer** → Chebyshev approx of softmax via QSVT on $QK^T/\sqrt{d}$

---
layout: divider
title: "Part 6 — Poly-Logarithmic Depth: Why Analytic Functions Win"
---

---
layout: content
title: "What $O(\\text{poly}\\log(1/\\varepsilon))$ Means"
---
- The claim: QSVT approximates smooth functions to precision $\varepsilon$ with circuit depth $d_{\text{poly}} = O(\log^k(1/\varepsilon))$
- **Not** $O(1/\varepsilon)$ or $O(1/\varepsilon^2)$ — depth grows only logarithmically as $\varepsilon \to 0$
- For $\varepsilon = 10^{-6}$:
    - $O(1/\varepsilon^2) = 10^{12}$ — infeasible
    - $O(1/\varepsilon) = 10^6$ — infeasible
    - $O(\log(1/\varepsilon)) \approx 14$ — trivially feasible
- **Key condition:** the target function must be **analytic** (not merely smooth) on $[-1,1]$

---
layout: content
title: "Link 1 — Circuit Depth Equals Polynomial Degree"
---
- In a QSP circuit with phase angles $\{\phi_1, \ldots, \phi_d\}$, the circuit implements a degree-$d$ polynomial:

$$d_{\text{circuit}} = d_{\text{poly}}$$

- The question reduces to: **how high a degree polynomial approximates the target function to precision $\varepsilon$?**
- This is a classical question from **approximation theory** — independent of quantum mechanics
- The answer depends entirely on the **analyticity** of the target function, not on the domain size or qubit count

---
layout: proof
title: "Link 2 — Chebyshev Approximation: Analytic Functions Converge Exponentially"
---
- **Smooth** function on $[-1,1]$: best degree-$d$ Chebyshev approximation satisfies:

$$\|f - p_d\|_\infty \leq \frac{C \cdot M_k}{d^k} \qquad \text{(algebraic convergence)}$$

- **Analytic** function (analytic on a complex strip containing $[-1,1]$): convergence is **exponential** in $d$:

$$\|f - p_d\|_\infty \leq C \cdot r^{-d}, \quad r > 1$$

- Softmax involves $e^\sigma$ — **entire** (analytic on all of $\mathbb{C}$), so $r > 1$ can be large, giving very fast convergence

---
layout: proof
title: "Link 3 — Inverting for Degree $d$"
---
- Set $C \cdot r^{-d} \leq \varepsilon$ and solve:

$$r^{-d} \leq \frac{\varepsilon}{C} \quad\Longrightarrow\quad -d\log r \leq \log\!\left(\frac{\varepsilon}{C}\right) \quad\Longrightarrow\quad d \geq \frac{\log(C/\varepsilon)}{\log r}$$

$$\boxed{d = O\!\left(\log(1/\varepsilon)\right)}$$

- For GELU and softmax (entire functions), this is $O(\text{poly}\log(1/\varepsilon))$ with exponent $k = 1$
- **Caveat:** the constant hidden in $O(\cdot)$ includes $\alpha$ from block encoding — often large and frequently suppressed in complexity claims

