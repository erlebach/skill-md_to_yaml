---
layout: content
title: "Shots in Practice: NISQ Explodes, FTQC Stays Flat"
---
- **1 qubit (Hadamard + measure):** NISQ $\sim 5{,}000$ shots (statistics + modest mitigation); FTQC $\sim 3{,}000$ (statistics only)
- **4 qubits (GHZ state):** NISQ $\sim 50{,}000$ shots — noise leaks probability across all 16 bitstrings, forcing heavy mitigation; FTQC $\sim 2{,}000$
- **64 qubits (deep algorithm):** NISQ — intractable; error mitigation overhead becomes exponential in circuit depth; FTQC $\sim 40$ shots for a high-probability-output algorithm (Shor's, QPE)
- **Key point:** NISQ shot count grows with qubit count because **noise accumulates**; FTQC stays near the statistical floor

