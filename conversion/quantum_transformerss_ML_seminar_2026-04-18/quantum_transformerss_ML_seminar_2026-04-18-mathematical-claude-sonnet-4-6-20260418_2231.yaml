---
layout: content
title: "Activation Choice Is Not Cosmetic — It Determines Feasibility"
---
- **GELU:** $\text{GELU}(x) = x \cdot \Phi(x)$ — entire function; degree $d = O(\log(1/\varepsilon))$
- **Softmax:** involves $e^\sigma$ — entire; degree $d = O(\log(1/\varepsilon))$
- **ReLU:** $\text{ReLU}(x) = (x + |x|)/2$ — involves $|x|$ which is **not analytic** at $x = 0$:

$$\| |x| - p_d(x)\;\|_\infty \leq O(1/d) \quad \Rightarrow \quad d = O(1/\varepsilon) \text{ for ReLU}$$

- At $\varepsilon = 10^{-3}$: GELU needs depth $\approx 10$; ReLU needs depth $10^3$ — three orders of magnitude more

---
layout: divider
title: "Part 7 — GUO Quantum Transformer Architecture"
---

---
layout: content
title: Classical Attention — The Target Formula
---
$$\text{Attention}(Q, K, V) = \text{softmax}\!\left(\frac{QK^T}{\sqrt{d_k}}\right) V$$

- $Q, K, V \in \mathbb{R}^{S \times d}$
- Score matrix $QK^T \in \mathbb{R}^{S \times S}$ has a natural SVD — singular values encode attention pattern strengths
- Classical cost: $O(S^2 d)$ — quadratic in context length
- **Quantum target:** QSVT circuit of depth $O(\text{poly}\log(Sd))$ under QRAM + sparsity assumptions

---
layout: two-column
title: "Classical vs Quantum Attention at a Glance"
proportion: 50/50
left:
  type: figure
  src: classical_vs_quantum_attention.svg
  alt_text: "Side-by-side flowchart contrasting classical and quantum attention computation. Classical path (blue header, O(S-squared d)): compute QK-transpose (S-squared d FLOPs), apply softmax (S-squared FLOPs), multiply by V (S-squared d FLOPs). Quantum path (green header, O(polylog Sd)): block-encode QK-transpose in O(d polylog S), apply QSVT softmax in O(log 1/epsilon), multiply by V via QSVT in O(log 1/epsilon)."
---
- Classical cost is **quadratic** in $S$ — the bottleneck for long-context LLMs
- Quantum cost is **poly-logarithmic** in $S$ — under QRAM and sparsity assumptions
- Every stage of the quantum pipeline requires a block-encoded oracle call
- The five-stage GUO pipeline maps exactly to the classical five operations

---
layout: content
title: "Stage 1 — Data Loading: The QRAM Bottleneck"
---
- Quantum amplitude encoding of $\mathbf{q}_i \in \mathbb{R}^d$:

$$|\mathbf{q}_i\rangle = \frac{1}{\|\mathbf{q}_i\|} \sum_{j=0}^{d-1} q_{ij}|j\rangle$$

- **Naive loading:** requires $O(d)$ operations — destroys the poly-log speedup
- **QRAM:** hardware tree structure that queries memory in $O(\log d)$ parallel time using $O(d)$ circuit elements
- **Reality:** QRAM hardware does not exist at scale; highly sensitive to decoherence; error-correction requirements enormous
- **Without QRAM:** readin is $O(d)$ or $O(S)$ — and the end-to-end speedup vanishes

---
layout: content
title: "Stages 2–3 — Block-Encode QK^T, Apply Softmax via QSVT"
---
- **Stage 2:** construct $U_A$ such that $\langle 0|^{\otimes a} U_A |0\rangle^{\otimes a} = QK^T / (\alpha\sqrt{d_k})$
    - $d$-sparse attention: $O(d \cdot \text{poly}(\log S))$ T-gates
    - Dense attention ($d = S$): partially negates the quantum advantage
- **Stage 3:** softmax via QSVT — $e^\sigma$ is entire so:

$$d_{\text{poly}} = O\!\left(\log(1/\varepsilon)\right)$$

The QSVT circuit of depth $d_{\text{poly}}$ applies the Chebyshev approximation of softmax to **every singular value simultaneously**

---
layout: content
title: "Stages 4–5 — Multiply by V and Measurement"
---
- **Stage 4:** second block-encoded QSVT applies $V$ — total depth $O(d_{\text{softmax}} \cdot d_{\text{mult}})$, both poly-logarithmic
- **Stage 5 — measurement dilemma:**
    - **Sample:** $O(1/\varepsilon^2)$ shots per token, times $S$ tokens — total $O(S/\varepsilon^2)$ shots for full output
    - **Maintain coherence:** feed each block's output directly into the next as a quantum state — avoids readout cost, but T-gate count grows as $O(L \cdot d_{\text{poly}} \cdot T_{\text{gate}}(U_A))$
- **LayerNorm problem:** classical cost $O(Sd)$ and negligible; quantum implementation requires nonlinear operations (mean, variance, normalize) on amplitude-encoded states — does not fit QSVT; **unsolved**

