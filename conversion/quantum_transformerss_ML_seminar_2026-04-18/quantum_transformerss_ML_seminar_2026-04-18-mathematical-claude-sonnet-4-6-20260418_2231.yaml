layout: divider
title: "Part 5 — From Classical SVD to QSVD"
---

---
layout: content
title: Classical SVD — The Geometric Foundation
---
- Every matrix $A \in \mathbb{C}^{m \times n}$ admits:

$$A = U \Sigma V^\dagger$$

- $U$, $V$ unitary (rotations); $\Sigma$ diagonal with singular values $\sigma_1 \geq \sigma_2 \geq \cdots \geq \sigma_r \geq 0$
- **Geometric reading:** $V^\dagger$ rotates input to right singular vector basis; $\Sigma$ stretches along those axes; $U$ rotates result to output basis
- **Key insight:** the singular values $\{\sigma_i\}$ are the intrinsic amplitudes of the transformation — basis-independent and encoding all scaling information
- **Why target singular values?** Low-rank approximation, pseudoinverse, and attention scores are all functions of $\{\sigma_i\}$

