---
layout: content
title: Three FFN-Specific Caveats
---
- **1. Activation choice is load-bearing:** GELU gives $O(\log(1/\varepsilon))$ depth; ReLU gives $O(1/\varepsilon)$ — at $\varepsilon = 10^{-3}$ that is three orders of magnitude inflation. Any quantum FFN claim must specify which activation and justify it.
- **2. Weight matrices change during training:** recompiling $U_{W_1}$ after each gradient step requires recomputing QSVT phase angles (via QSPPACK/pyqsp). Training a quantum transformer is almost entirely an open problem.
- **3. Intermediate states cannot be cloned:** between $W_1$ and $W_2$, intermediate activations exist only as quantum states — inspecting, storing, or differentiating them requires measurement, which collapses the state. Backpropagation through quantum circuits has no settled solution at scale.

---
layout: divider
title: "Part 10 — Critical Caveats and Open Problems"
---

---
layout: content
title: "Caveat 1 — QRAM Is Load-Bearing and Speculative"
---
- The $O(\text{poly}\log(Sd))$ speedup depends entirely on QRAM loading data in $O(\log N)$ time
- Without QRAM, readin costs $O(N)$ and the speedup vanishes — this is not a footnote, it is the entire argument
- **Dequantization (Ewin Tang, 2018):** many quantum linear algebra speedups can be matched classically with sample-and-query access — the conditions that enable QRAM also enable classical dequantization
- GUO's result needs rigorous analysis to show it is not dequantizable via Tang-style classical algorithms

---
layout: content
title: "Caveat 2 — Hidden Constants and Subnormalization"
---
- Every $O(\text{poly}\log)$ claim hides the product $\alpha_1 \cdot \alpha_\sigma \cdot \alpha_2$ from block encoding
- For attention: $\alpha \geq \|QK^T/\sqrt{d_k}\|$ — can be $O(S\sqrt{d})$ in the worst case
- **Example:** if $\alpha = O(S^{1/2})$ and $d_{\text{poly}} = O(\log(1/\varepsilon))$, the actual T-gate cost is $O(S^{1/2} \log(1/\varepsilon) \cdot \text{poly}(\log S))$ — better than classical $O(S^2)$ but not $O(\text{poly}\log S)$
- Honest speedup claims must report $\alpha$ explicitly and verify it is bounded by $O(\text{poly}\log)$

---
layout: content
title: Open Problems in Quantum Transformers
---
- **LayerNorm:** classical $O(Sd)$, negligible; quantum requires nonlinear operations (mean, variance, normalize) on amplitude-encoded states — does not fit the QSVT spectral framework; genuinely unsolved
- **Backpropagation:** intermediate activations as quantum states cannot be inspected or differentiated without measurement; quantum gradient descent at transformer scale has no settled solution
- **QRAM hardware:** enabling assumption for all quantum ML speedup claims; no large-scale prototype; fundamental decoherence obstacles remain
- **Multi-head attention:** the GUO analysis assumes a single head; multi-head introduces additional structure not fully characterized
- **Dequantization check:** rigorous analysis of whether GUO's result is susceptible to Tang-style classical speedup

---
layout: summary
title: "Summary — Quantum Transformers: What We Know"
---
- **Classical baseline:** attention FLOPs $= 4Sd^2 + 2S^2d$ per layer; for modern LLMs the $S^2d$ term dominates heavily
- **Quantum engine:** QSVT applies any bounded polynomial to all singular values in $O(d_{\text{poly}})$ depth; analytic functions (GELU, softmax) achieve $d_{\text{poly}} = O(\log(1/\varepsilon))$
- **End-to-end speedup claim:** $O(S^2 d) \to O(\text{poly}\log(Sd))$ under QRAM + sparse attention + FTQC + bounded $\alpha$
- **Three caveats:** QRAM is speculative; $\alpha$ hides potentially large constants; dequantization may recover the speedup classically
- **Open Problems:** LayerNorm, backpropagation, QRAM hardware, multi-head analysis
- **Bottom line:** beautiful mathematics with exponential potential — but every load-bearing assumption needs independent verification
