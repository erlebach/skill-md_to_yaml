<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 546" width="100%" height="auto">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#aaaaaa"/>
    </marker>
  </defs>

  <!-- ══ Classical column (center x=155) ══ -->

  <!-- Header -->
  <rect x="20" y="20" width="270" height="80" rx="6" fill="#1a4a8a"/>
  <foreignObject x="20" y="20" width="270" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:270px;height:80px;display:flex;align-items:center;justify-content:center;color:#ffffff;font-size:22px;text-align:center;font-family:sans-serif;">
      Classical:&nbsp;<math display="inline"><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mi>S</mi><mn>2</mn></msup><mi>d</mi><mo stretchy="false">)</mo></mrow></math>
    </div>
  </foreignObject>

  <line x1="155" y1="100" x2="155" y2="134" stroke="#aaaaaa" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 2 -->
  <rect x="20" y="136" width="270" height="108" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1.5"/>
  <foreignObject x="20" y="136" width="270" height="108">
    <div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:270px;height:108px;display:flex;align-items:center;justify-content:center;color:#e5e7eb;font-size:22px;text-align:center;font-family:sans-serif;">
      <span><math display="inline"><mrow><mi>Q</mi><msup><mi>K</mi><mi>T</mi></msup></mrow></math>:&nbsp;<math display="inline"><mrow><msup><mi>S</mi><mn>2</mn></msup><mi>d</mi></mrow></math>&nbsp;FLOPs</span>
    </div>
  </foreignObject>

  <line x1="155" y1="244" x2="155" y2="278" stroke="#aaaaaa" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 3 -->
  <rect x="20" y="280" width="270" height="108" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1.5"/>
  <foreignObject x="20" y="280" width="270" height="108">
    <div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:270px;height:108px;display:flex;align-items:center;justify-content:center;color:#e5e7eb;font-size:22px;text-align:center;font-family:sans-serif;">
      <span>softmax:&nbsp;<math display="inline"><mrow><msup><mi>S</mi><mn>2</mn></msup></mrow></math>&nbsp;FLOPs</span>
    </div>
  </foreignObject>

  <line x1="155" y1="388" x2="155" y2="422" stroke="#aaaaaa" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 4 -->
  <rect x="20" y="424" width="270" height="108" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1.5"/>
  <foreignObject x="20" y="424" width="270" height="108">
    <div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:270px;height:108px;display:flex;align-items:center;justify-content:center;color:#e5e7eb;font-size:22px;text-align:center;font-family:sans-serif;">
      <span><math display="inline"><mrow><mo>&#x00D7;</mo><mi>V</mi></mrow></math>:&nbsp;<math display="inline"><mrow><msup><mi>S</mi><mn>2</mn></msup><mi>d</mi></mrow></math>&nbsp;FLOPs</span>
    </div>
  </foreignObject>

  <!-- ══ Quantum column (center x=545) ══ -->

  <!-- Header -->
  <rect x="410" y="20" width="270" height="80" rx="6" fill="#166534"/>
  <foreignObject x="410" y="20" width="270" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:270px;height:80px;display:flex;align-items:center;justify-content:center;color:#ffffff;font-size:21px;text-align:center;font-family:sans-serif;">
      Quantum:&nbsp;<math display="inline"><mrow><mi>O</mi><mo stretchy="false">(</mo><mo>polylog</mo><mo stretchy="false">(</mo><mi>S</mi><mi>d</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow></math>
    </div>
  </foreignObject>

  <line x1="545" y1="100" x2="545" y2="134" stroke="#aaaaaa" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 2 -->
  <rect x="410" y="136" width="270" height="108" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1.5"/>
  <foreignObject x="410" y="136" width="270" height="108">
    <div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:270px;height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e5e7eb;font-size:21px;text-align:center;font-family:sans-serif;line-height:1.6;">
      <span>Block-encode&nbsp;<math display="inline"><mrow><mi>Q</mi><msup><mi>K</mi><mi>T</mi></msup></mrow></math></span>
      <span><math display="inline"><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>d</mi><mo>polylog</mo><mi>S</mi><mo stretchy="false">)</mo></mrow></math></span>
    </div>
  </foreignObject>

  <line x1="545" y1="244" x2="545" y2="278" stroke="#aaaaaa" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 3 -->
  <rect x="410" y="280" width="270" height="108" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1.5"/>
  <foreignObject x="410" y="280" width="270" height="108">
    <div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:270px;height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e5e7eb;font-size:21px;text-align:center;font-family:sans-serif;line-height:1.6;">
      <span>QSVT softmax</span>
      <span><math display="inline"><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>log</mi><mn>1</mn><mo>/</mo><mi>&#x03B5;</mi><mo stretchy="false">)</mo></mrow></math></span>
    </div>
  </foreignObject>

  <line x1="545" y1="388" x2="545" y2="422" stroke="#aaaaaa" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Box 4 -->
  <rect x="410" y="424" width="270" height="108" rx="4" fill="#111827" stroke="#4b5563" stroke-width="1.5"/>
  <foreignObject x="410" y="424" width="270" height="108">
    <div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:270px;height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e5e7eb;font-size:21px;text-align:center;font-family:sans-serif;line-height:1.6;">
      <span>QSVT&nbsp;<math display="inline"><mrow><mo>&#x00D7;</mo><mi>V</mi></mrow></math></span>
      <span><math display="inline"><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>log</mi><mn>1</mn><mo>/</mo><mi>&#x03B5;</mi><mo stretchy="false">)</mo></mrow></math></span>
    </div>
  </foreignObject>
</svg>
