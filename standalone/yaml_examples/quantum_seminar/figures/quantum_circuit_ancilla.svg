<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Outer background -->
  <rect width="880" height="500" fill="white" stroke="#cccccc" stroke-width="1" rx="8"/>

  <!-- Title -->
  <text x="440" y="38" text-anchor="middle" font-size="15" fill="#444">Case a = 1 — one ancilla qubit</text>

  <!-- ── Wire y-coords: |0⟩=175, |ψ₀⟩=292, |ψ₁⟩=338, |ψ₂⟩=384
       Blue box: x=310–700, y=100–420, divider at x=505, y=260
       Each block: 195 × 160 px (landscape) ── -->

  <defs>
    <clipPath id="box-clip">
      <rect x="310" y="100" width="390" height="320" rx="14"/>
    </clipPath>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- ── BLOCK FILLS (clipped to blue box) ── -->
  <!-- A/α: top-left, pink -->
  <rect x="310" y="100" width="195" height="160" fill="#fde8e8" clip-path="url(#box-clip)"/>
  <!-- B: top-right, cream -->
  <rect x="505" y="100" width="195" height="160" fill="#f5efe0" clip-path="url(#box-clip)"/>
  <!-- C: bottom-left, cream -->
  <rect x="310" y="260" width="195" height="160" fill="#f5efe0" clip-path="url(#box-clip)"/>
  <!-- D: bottom-right, cream -->
  <rect x="505" y="260" width="195" height="160" fill="#f5efe0" clip-path="url(#box-clip)"/>

  <!-- Internal grid lines -->
  <line x1="310" y1="260" x2="700" y2="260" stroke="#cfc8b4" stroke-width="1.3" clip-path="url(#box-clip)"/>
  <line x1="505" y1="100" x2="505" y2="420" stroke="#cfc8b4" stroke-width="1.3" clip-path="url(#box-clip)"/>

  <!-- A/α red border -->
  <rect x="312" y="102" width="191" height="156" rx="9" fill="none" stroke="#c0392b" stroke-width="2.2" clip-path="url(#box-clip)"/>

  <!-- Blue outer box border (on top) -->
  <rect x="310" y="100" width="390" height="320" rx="14" fill="none" stroke="#5b9bd5" stroke-width="3"/>

  <!-- ── BLOCK LABELS ── -->
  <text x="407" y="173" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">A/α</text>
  <text x="407" y="196" text-anchor="middle" font-size="12.5" fill="#c0392b">top-left block</text>

  <text x="602" y="185" text-anchor="middle" font-size="20" fill="#555">B</text>

  <text x="407" y="346" text-anchor="middle" font-size="20" fill="#555">C</text>
  <text x="602" y="346" text-anchor="middle" font-size="20" fill="#555">D</text>

  <!-- ── WIRES ── -->
  <!-- |0⟩ ancilla: y=175 -->
  <line x1="180" y1="175" x2="310" y2="175" stroke="#333" stroke-width="1.8"/>
  <line x1="700" y1="175" x2="748" y2="175" stroke="#333" stroke-width="1.8"/>
  <line x1="796" y1="175" x2="828" y2="175" stroke="#333" stroke-width="1.8"/>

  <!-- System wires left -->
  <line x1="210" y1="292" x2="310" y2="292" stroke="#333" stroke-width="1.8"/>
  <line x1="210" y1="338" x2="310" y2="338" stroke="#333" stroke-width="1.8"/>
  <line x1="210" y1="384" x2="310" y2="384" stroke="#333" stroke-width="1.8"/>

  <!-- System wires right -->
  <line x1="700" y1="292" x2="778" y2="292" stroke="#333" stroke-width="1.8"/>
  <line x1="700" y1="338" x2="778" y2="338" stroke="#333" stroke-width="1.8"/>
  <line x1="700" y1="384" x2="778" y2="384" stroke="#333" stroke-width="1.8"/>

  <!-- Dashed separator (ancilla / system) -->
  <line x1="215" y1="218" x2="700" y2="218" stroke="#aaa" stroke-width="1.4" stroke-dasharray="6,4"/>

  <!-- ── MEASUREMENT BOX (y=175 ancilla wire) ── -->
  <rect x="748" y="154" width="48" height="42" rx="5" fill="white" stroke="#777" stroke-width="1.5"/>
  <!-- Galvanometer symbol: arc at bottom, needle pointing up-right -->
  <!-- Arc: semicircle opening upward, centered at (772, 185) -->
  <path d="M 756,186 A 16,16 0 0 1 788,186" fill="none" stroke="#555" stroke-width="1.8"/>
  <!-- Needle from center (772,186) pointing up-right -->
  <line x1="772" y1="186" x2="784" y2="163" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ── LEFT LABELS ── -->
  <text x="172" y="180" text-anchor="end" font-size="15" fill="#333">|0⟩</text>

  <!-- n+1 qubits label -->
  <text x="108" y="332" text-anchor="middle" font-size="13" fill="#555">n+1</text>
  <text x="108" y="350" text-anchor="middle" font-size="13" fill="#555">qubits</text>

  <!-- Bracket spanning |ψ₀⟩ – |ψ₂⟩ -->
  <line x1="142" y1="284" x2="142" y2="392" stroke="#555" stroke-width="1.8"/>
  <line x1="142" y1="284" x2="153" y2="284" stroke="#555" stroke-width="1.8"/>
  <line x1="142" y1="392" x2="153" y2="392" stroke="#555" stroke-width="1.8"/>

  <!-- Ket labels -->
  <text x="202" y="297" text-anchor="end" font-size="15" fill="#333">|ψ₀⟩</text>
  <text x="202" y="343" text-anchor="end" font-size="15" fill="#333">|ψ₁⟩</text>
  <text x="202" y="389" text-anchor="end" font-size="15" fill="#333">|ψ₂⟩</text>

  <!-- ── RIGHT LABEL ── -->
  <text x="834" y="180" font-size="14" fill="#333">→ |0⟩</text>

  <!-- ── BELOW BOX ── -->
  <text x="440" y="458" text-anchor="middle" font-size="13" fill="#555">post-select ancilla → system sees A/α</text>

</svg>
