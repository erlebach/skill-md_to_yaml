A pipeline expressed as a structured table of processing stages:

| Stage | Operation | Output Shape |
|---|---|---|
| Embedding | $x \mapsto W_E x,\quad W_E \in \mathbb{R}^{d \times V}$ | $(B, T, d)$ |
| Attention | $\text{softmax}\!\left(\frac{QK^\top}{\sqrt{d_k}}\right)V$ | $(B, T, d)$ |
| FFN | $\max(0,\, xW_1 + b_1)W_2 + b_2$ | $(B, T, d)$ |
| Layer Norm | $\frac{x - \mu}{\sigma + \epsilon} \cdot \gamma + \beta$ | $(B, T, d)$ |

Arrows between rows imply sequential composition: $f_4 \circ f_3 \circ f_2 \circ f_1$.
