---
layout: content
title: "Unicode Limits in Mermaid Node Labels"
---
**What works in Mermaid node labels:**

- Greek letters: α β γ δ ε ζ η θ λ μ ν π ρ σ τ φ ψ ω
- Operators: ∇ ∂ ∑ ∏ ∫ ∞ ∈ ∉ ⊂ ⊃ ∪ ∩ ≤ ≥ ≠ ≈ ±
- Arrows: → ← ↑ ↓ ⟨ ⟩ ⊗ ⊕
- Subscripts/superscripts (Unicode): xᵢ x² ψ₀ θₖ

**What does NOT work:**

- True fractions: $\frac{\alpha}{\beta}$ — no layout engine in Mermaid labels
- Nested structures: $\sum_{i=0}^{n}$ — superscript/subscript positioning
- Operators: $\hat{H}$, $\tilde{O}$, $\mathcal{L}$ — require LaTeX rendering

