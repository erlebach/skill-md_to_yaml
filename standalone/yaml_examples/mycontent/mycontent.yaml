layout: two-column
title: "Flowchart + Equation Table Side by Side"
right:
  type: diagram
  alt_text: Simple flowchart of an iterative update step using Unicode symbols
  source: |
    graph TD
      A["θ₀ ← init"] --> B["Compute ∇L(θ)"]
      B --> C["θ ← θ − η∇L"]
      C --> D{"‖∇L‖ < ε?"}
      D -->|"No"| B
      D -->|"Yes"| E["Return θ*"]
      style E fill:#1a5c3a,color:#ffffff
---
**Update rule** at step $k$:

$$\theta_{k+1} = \theta_k - \eta \nabla_\theta \mathcal{L}(\theta_k)$$

**Convergence** when:

$$\|\nabla \mathcal{L}(\theta_k)\| < \varepsilon$$

**Learning rate** schedule:

$$\eta_k = \frac{\eta_0}{1 + \lambda k}$$

