layout: content
title: "Table as Quadrant — With KaTeX Equations"
notes: "This is the key case: equations in cells that Mermaid cannot express."
---
Bias-variance decomposition across model complexity:

| | **High Bias** | **Low Bias** |
|---|---|---|
| **High Variance** | $\text{Error} = \sigma^2 + \mu^2 + \text{Var}$ (worst) | Overfit: $\hat{f}(x) \approx f(x)$ on train only |
| **Low Variance** | Underfit: $\mathbb{E}[\hat{f}] \neq f(x)$ | $\text{MSE} = \sigma^2$ (ideal) |

---
layout: content
title: "Math-Grid: Complexity Comparison Table"
notes: "A richer table replacing what would otherwise be a diagram. Full KaTeX in every cell."
---
| Method | Query Cost | Update Cost | Space |
|---|---|---|---|
| Brute force | $O(n \cdot d)$ | $O(1)$ | $O(n \cdot d)$ |
| KD-tree | $O(\sqrt{n} \cdot d)$ | $O(\log n)$ | $O(n)$ |
| LSH | $O(n^\rho \cdot d)$ where $\rho < 1$ | $O(1)$ | $O(n^{1+\rho})$ |
| HNSW | $O(\log n \cdot d)$ | $O(\log n)$ | $O(n \cdot M)$ |

where $M$ is the max number of connections per node.

