---
layout: hero
title: "What Makes Density-Based Clustering Unique?"
---
Unlike k-means, density-based methods discover clusters of **arbitrary shape**, naturally handle **noise and outliers**, and require no assumption about the number of clusters.

---
layout: content
title: "Core Idea: Density as the Organizing Principle"
---
- A **cluster** is a region of high point density separated from other clusters by regions of low density
- Points in low-density regions are treated as **noise** (not assigned to any cluster)
- No assumption required about cluster shape or count
- Three main density-based approaches: **grid-based**, **kernel-based** (DENCLUE), and **subspace** (CLIQUE)

---
layout: two-column
title: "Grid-Based Clustering: Algorithm Overview"
proportion: 50/50
left:
  type: diagram
  alt_text: "Flowchart of grid-based clustering showing four steps: define grid cells, assign objects, eliminate low-density cells, form clusters"
  source: |
    graph TD
      A[Define grid cells] --> B[Assign objects to cells]
