title: "Fuzzy C-Means: Objective Function"
proportion: 60/40
left:
  type: diagram
  alt_text: "Diagram showing SSE formula with fuzzifier p applied to weights, connecting cluster centroids to weighted data points"
  source: |
    graph TD
      A["Initialize weights w_ij randomly (sum to 1)"] --> B["Fix c_j, update w_ij"]
      B --> C["Fix w_ij, update centroids c_j"]
      C --> D{Converged?}
      D -->|No| B
      D -->|Yes| E[Return soft cluster assignments]
      style A fill:#39c5cf,stroke:#39c5cf,color:#0d1117
      style E fill:#3fb950,stroke:#3fb950,color:#0d1117
---
**SSE with fuzzifier p (p > 1):**

$$\text{SSE} = \sum_{j=1}^{k} \sum_{i=1}^{m} w_{ij}^p \cdot \text{dist}(\mathbf{x}_i, \mathbf{c}_j)^2$$

Constraint: $$\sum_{j=1}^{k} w_{ij} = 1$$

- $$p = 1$$: no fuzziness (reduces to hard clustering)
- $$p = 2$$: typical choice; smooth weight gradients

---
layout: steps
title: "Fuzzy C-Means: Update Equations"
---
1. Initialize weights $$w_{ij}$$ randomly, subject to $$\sum_j w_{ij} = 1$$
2. Update centroids: $$\mathbf{c}_j = \sum_{i=1}^{m} w_{ij}^p \mathbf{x}_i \,/\, \sum_{i=1}^{m} w_{ij}^p$$
3. Update weights: $$w_{ij} = \frac{1}{\text{dist}(\mathbf{x}_i, \mathbf{c}_j)^{2/(p-1)}} \Bigg/ \sum_{q=1}^{k} \frac{1}{\text{dist}(\mathbf{x}_i, \mathbf{c}_q)^{2/(p-1)}}$$
4. Repeat steps 2–3 until convergence (weights stabilize)

---
layout: content
title: "Fuzzy C-Means: Practical Example"
---
- Point x = 2.5, cluster centers c1 = 1 and c2 = 5, with p = 2:
  - SSE is minimized when $$w_{x1} = 0.74, \; w_{x2} = 0.36$$
- Compared to hard clustering ($$w_{x1} = 1, w_{x2} = 0$$), SSE drops from 2.25 to 1.654
- Visualization: color each point by maximum membership weight (red = strong, blue = weak)
- Points at cluster boundaries get nearly equal weights — genuine ambiguity is preserved

---
layout: content
title: "Fuzzy C-Means: Application to Image Segmentation"
---
- Modified fuzzy c-means used in **fMRI image segmentation**
- Each pixel belongs to multiple tissue types with varying degree
- Key references: Gong et al. (2013), Ahmed et al. (2002)
- Fuzzy membership naturally models transition zones between tissue regions
- Outperforms hard segmentation for blurry boundaries in medical imaging
- Also used in: document clustering, remote sensing, anomaly detection

