---
layout: hero
title: "Beyond Hard Assignments"
---
Every data point belongs to every cluster — the question is only **how much**. Prototype-based soft clustering opens the door to probabilistic and topological views of cluster structure.

---
layout: comparison
title: "Hard (Crisp) vs. Soft (Fuzzy) Clustering"
---
**Hard (Crisp) Clustering**

- Each point belongs to exactly one cluster
- Weight $$w_{ij} \in \{0, 1\}$$
- Classic K-means: assign to nearest centroid
- Simple and fast; loses boundary information

<!-- split -->

**Soft (Fuzzy) Clustering**

- Each point belongs to all clusters with a degree
- Weight $$w_{ij} \in [0, 1]$$; sum over clusters = 1
- Captures ambiguity at cluster boundaries
- More expensive: all points relate to all clusters

---
