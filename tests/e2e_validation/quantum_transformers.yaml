title: "Quantum Holistic Attention"
proportion: 50/50
left:
  type: diagram
  alt_text: "Holistic attention architecture showing all N tokens loaded together into global quantum embedding, then processed by token mixing unitary operation without computing pairwise similarities explicitly"
  source: |
    graph TD
      A["All N tokens x_1 ... x_N"] --> B[Global Quantum Embedding]
      B --> C[Token Mixing Unitary]
      C --> D[Output: mixed token representations]
