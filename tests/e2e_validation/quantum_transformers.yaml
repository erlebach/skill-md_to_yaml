---
layout: content
title: "Quantum States and Data Encoding"
---
- A quantum state of n qubits: $$|\psi\rangle = \sum_{i=0}^{2^n-1} \alpha_i |i\rangle$$; amplitudes satisfy $$\sum_i |\alpha_i|^2 = 1$$
- **Qubit Encoding (QE)**: classical scalar x encoded via rotation gate $$R_y(x/2)|0\rangle$$
- **Amplitude Encoding (AE)**: vector $$\mathbf{x} = (x_0, \ldots, x_{2^n-1})$$ embedded directly in quantum amplitudes — exponentially space-efficient
- **Data Encoding is critical**: determines how classical information enters quantum circuits
- Trade-off: expressive encodings (AE) require complex circuit constructions

