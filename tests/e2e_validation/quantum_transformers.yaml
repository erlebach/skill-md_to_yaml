**PQC-based (near-term):**
- Parameterized Quantum Circuits on NISQ devices
- Replaces classical weight layers with PQCs
- Validated on small-scale benchmarks

**QLA-based (long-term):**
- Quantum Linear Algebra techniques (QSVT, block encoding)
- Theoretical exponential speedup
- Requires fault-tolerant quantum computers

---
layout: content
title: "Classical Transformer: Quick Recap"
---
- **Self-Attention**: each token attends to all others; captures long-range dependencies
- **QKV Mapping**: input projected to Queries (Q), Keys (K), Values (V) via learned matrices
- **Attention matrix**: $$\mathbf{A} = \text{softmax}\left(\frac{\mathbf{QK}^T}{\sqrt{d_k}}\right)$$; output: $$\mathbf{Y} = \mathbf{A}\mathbf{V}$$
- **Multi-head attention**: h independent attention heads concatenated and projected
- **Feed-Forward Network**: $$\text{FFN}(\mathbf{Z}) = \max(0, \mathbf{ZW}_1 + \mathbf{b}_1)\mathbf{W}_2 + \mathbf{b}_2$$
- **Residual + LayerNorm**: $$\mathbf{Z} = \text{LayerNorm}(\mathbf{X}_\text{in} + f(\mathbf{X}_\text{in}))$$

