---
layout: hero
title: "The Central Question"
---
Classical Transformers scale quadratically with sequence length. Can quantum computing break this bottleneck — or merely redistribute the computational cost?

---
layout: content
title: "Why Quantum Transformers? The Motivation"
---
- Classical Transformer self-attention: complexity grows as $$O(N^2)$$ with sequence length N
- **Quantum Machine Learning (QML)** leverages superposition, entanglement, and interference
- Core goal: reduce quadratic scaling while maintaining or improving expressiveness
- Since 2022: rapid expansion of research into Quantum Transformer architectures
- Applications span NLP, computer vision, high-energy physics, chemistry, finance, fluid dynamics

