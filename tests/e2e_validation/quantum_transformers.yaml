  type: diagram
  alt_text: "PQC structure showing input quantum state passing through alternating rotation gates Rx, Ry and entangling CNOT gates across four qubit lines, with trainable parameters theta controlling rotation angles"
  source: |
    graph LR
      A[Input state psi_0] --> B["Layer 1: Rx Ry rotations"]
      B --> C[CNOT entangling gates]
      C --> D["Layer 2: Rx Ry rotations"]
      D --> E[More CNOT gates]
      E --> F["Output state psi(theta)"]
      style A fill:#58a6ff,stroke:#58a6ff,color:#0d1117
      style F fill:#3fb950,stroke:#3fb950,color:#0d1117
---
- PQCs extend quantum circuits with **trainable parameters** $$\theta$$
- Unitary: $$U(\theta) = U_L(\theta_L) \cdots U_2(\theta_2) U_1(\theta_1)$$
- Used in Variational Quantum Algorithms (VQAs): optimize $$C(\theta) = \langle\psi(\theta)|H|\psi(\theta)\rangle$$
- Classical optimizer updates $$\theta$$; combines quantum expressiveness with classical flexibility

---
layout: content
title: "Key Quantum Tools: Kernel, Swap Test, QSVT"
---
- **Quantum Kernel**: maps classical data to Hilbert space; $$K(x_i, x_j) = |\langle\psi(x_i)|\psi(x_j)\rangle|^2$$; enables quantum-enhanced similarity computation
- **Swap Test**: quantum circuit that estimates $$\frac{1 + |\langle\psi|\phi\rangle|^2}{2}$$; measures similarity between two quantum states without full state tomography
- **Hadamard Test**: estimates $$\text{Re}(\langle\psi|U|\psi\rangle)$$ using ancilla qubit; evaluates expectation values of unitary operators
- **QSVT** (Quantum Singular Value Transformation): powerful framework for quantum linear algebra; enables exponential speedups for matrix operations in fault-tolerant settings

