layout: two-column
title: "Dense vs. Sparse Cluster Structure"
proportion: 50/50
---
**Dense Clusters**

- Points tightly packed around centroid
- Small covariance matrix $\Sigma$
- High likelihood peaks sharply
- Typical in well-separated data

<!-- split -->

**Sparse Clusters**

- Points spread widely around centroid
- Large covariance — flat likelihood
- Cluster boundaries diffuse
- More susceptible to overlap with adjacent clusters

EM with full covariance Gaussians can discover elliptical dense clusters that K-means (spherical assumption) cannot capture.
---
layout: comparison
title: "Pros and Cons of the EM Algorithm"
---
**Pros**

- Monotonically increases log-likelihood
- Soft assignments — principled uncertainty
- Handles elliptical cluster shapes
- Compact, interpretable Gaussian parameters

<!-- split -->

**Cons**

- Convergence can be very slow
- Only guarantees local maximum, not global
- Strong Gaussian assumptions may not hold
- Covariance has O(d²) parameters — costly in high dimensions
---
layout: content
title: "Alternatives to EM"
---
- **Method of Moments / Spectral Methods** — globally convergent for specific model families; no local-optima problem
- **Markov Chain Monte Carlo (MCMC)** — fully Bayesian inference over cluster parameters; computationally expensive
- **Variational Inference** — approximate Bayesian approach, faster than MCMC
- **K-Means ++** — smarter initialization to reduce local-optima risk

Each alternative trades statistical guarantees for computational cost or modeling flexibility.
---
layout: content
title: "Self-Organizing Maps (SOM)"
---
- Centroid-based clustering with a fixed number of clusters (like K-means)
- Key difference: **spatial relationships between centroids are also specified**
- Centroids are arranged in a grid (1D, 2D, or higher)
- When a point is assigned to the closest centroid, *neighboring centroids* are also updated

**Intuition:** Nearby grid positions learn similar patterns, producing a topology-preserving map of the input space.

*Kohonen, T. "Self-Organizing Maps." Springer, 1995.*
---
layout: diagram
title: "SOM: How Updates Work"
alt_text: "A 5-by-2 grid of SOM centroid nodes. The center node in the top row is labeled W (winner) and highlighted in amber. Its immediate grid neighbors are shown in orange-brown, indicating medium-sized updates. Corner nodes farthest from the winner are dark, indicating little or no update. An arrow from above labeled 'input x' points to the winner node."
---
- Update magnitude weighted by grid distance to winner
- Learning rate and neighborhood radius *decrease over time*
---
layout: content
title: "SOM as Dimensionality Reduction"
---
- High-dimensional input data is mapped onto a low-dimensional grid (usually 2D)
- Nearby grid cells represent similar patterns in the original space
- The 2D grid can be visualized directly — no further projection needed
- Useful for exploring cluster structure in high-dimensional data

**SOM vs PCA:** PCA finds a linear projection; SOM finds a non-linear topology-preserving mapping. SOM can "unfold" curved manifolds that PCA cannot.
