layout: two-column
title: "Hard vs. Soft Clustering"
proportion: 50/50
---
**Hard (Crisp)**

- Each point belongs to exactly one cluster
- Membership weight $w_{ij} \in \{0, 1\}$
- Classic K-means is hard clustering

<!-- split -->

**Soft (Fuzzy)**

- A point may partially belong to multiple clusters
- Membership weight $w_{ij} \in [0, 1]$
- Weights sum to 1 across all clusters

**Key insight:** Soft clustering captures ambiguous, overlapping structure that hard clustering discards.
---
layout: content
title: "Generalizing the SSE Objective"
---
Soft clustering generalizes K-means by weighting each point's contribution:

$$\text{SSE} = \sum_{j=1}^{k} \sum_{i=1}^{m} w_{ij} \cdot \text{dist}(x_i, c_j)^2 \qquad \text{subject to} \quad \sum_{j=1}^{k} w_{ij} = 1$$

To minimize SSE, alternate between two steps:

- Fix centroids $c_j$ → update weights $w_{ij}$
- Fix weights $w_{ij}$ → recompute centroids $c_j$
---
layout: diagram
title: "Estimating Weights: Intuition"
alt_text: "Number line showing point x at 2.5 between centroids c1 at position 1 and c2 at position 5. The distance from x to c1 is 1.5 units; the distance from x to c2 is 2.5 units. Point x is closer to c1."
---
Consider a single point **x = 2.5** between two centroids **c₁ = 1** and **c₂ = 5**:

$$\text{SSE}(x) = w_{x1}(2.5 - 1)^2 + w_{x2}(5 - 2.5)^2 = 2.25\,w_{x1} + 6.25\,w_{x2}$$

Minimum at $w_{x1} = 1$, $w_{x2} = 0$ — hard assignment to nearest centroid.
---
layout: content
title: "Fuzzy C-Means: Objective Function"
---
Introduce a fuzziness exponent **p ≥ 1** to control overlap:

$$\text{SSE} = \sum_{j=1}^{k} \sum_{i=1}^{m} w_{ij}^{\,p} \cdot \text{dist}(x_i, c_j)^2 \qquad \sum_{j=1}^{k} w_{ij} = 1$$

- **p = 1:** degenerates to hard K-means
- **p = 2:** typical fuzzy setting (Bezdek 1981)
- **p → ∞:** all weights equal — maximum fuzziness

$w_{ij}^{\,p}$ penalizes uncertain assignments. Higher *p* spreads membership more evenly.
---
layout: content
title: "Fuzzy C-Means: Update Rules"
---
**Centroid update:**

$$c_j = \frac{\displaystyle\sum_{i=1}^{m} w_{ij}^{\,p}\, x_i}{\displaystyle\sum_{i=1}^{m} w_{ij}^{\,p}}$$

**Weight update:**

$$w_{ij} = \frac{\left(\dfrac{1}{\text{dist}(x_i,\, c_j)^2}\right)^{\!\frac{1}{p-1}}}{\displaystyle\sum_{q=1}^{k} \left(\dfrac{1}{\text{dist}(x_i,\, c_q)^2}\right)^{\!\frac{1}{p-1}}}$$

Points far from a centroid receive low weight for that cluster.
---
layout: steps
title: "Fuzzy C-Means: Algorithm"
---
1. **Initialize** weights $w_{ij}$ randomly, subject to $\sum_{j=1}^{k} w_{ij} = 1$
2. **Update centroids** using the weighted average formula
3. **Update weights** inversely proportional to distance
4. **Repeat** steps 2–3 until convergence
