layout: content
title: "Application: Image Segmentation"
---
Modified fuzzy c-means has been applied to segment **fMRI brain images**:

- Intensity values in each pixel = feature vector
- Clusters correspond to tissue types (gray matter, white matter, CSF)
- Fuzzy membership naturally handles boundary voxels
- Variant BCFCM adds spatial bias field correction

**Reference:** Ahmed et al. (2002) — "A modified fuzzy c-means algorithm for bias field estimation and segmentation of MRI data." *IEEE Trans. Medical Imaging*, 21(3).
---
layout: content
title: "Clustering with Mixture Models"
---
- Model data as arising from a **mixture of probability distributions**
- Typically Gaussian (normal) distributions — one per cluster
- Parameters estimated via the **EM algorithm**
- K-means is a limiting special case of this approach

**Why probabilistic?** Each point receives a probability of belonging to each cluster — providing soft assignments like fuzzy clustering, but grounded in statistical theory.
---
layout: figure
title: "Probabilistic Clustering: The Idea"
src: "_page_5_Figure_2.jpeg"
alt_text: "Histogram showing two distinct bell-shaped peaks, one centered near -5 and one near +5, suggesting two Gaussian distributions. The x-axis ranges from approximately -15 to 10 and y-axis from 0 to 500. Each peak rises to roughly 450–500 points at its mode and tapers on both sides, separated by a valley near x = 0."
---
Histogram of 1-D data with two visible peaks suggesting two underlying Gaussian distributions.

Each peak corresponds to one cluster. Estimate $\mu$ and $\sigma$ for each Gaussian to fully describe the clusters.
---
layout: content
title: "The Gaussian Probability Model"
---
The probability of observing point $x_i$ under Gaussian parameters $\Theta = \{\mu, \sigma\}$:

$$\text{prob}(x_i \mid \Theta) = \frac{1}{\sqrt{2\pi}\,\sigma}\; \exp\!\left(-\frac{(x - \mu)^2}{2\sigma^2}\right)$$

- Each cluster $C_j$ has its own $\mu_j$ and $\sigma_j$
- Assign a point to the cluster with highest posterior probability
- Extends naturally to multivariate Gaussians with covariance matrix $\Sigma$
---
layout: two-column
title: "The EM Algorithm: Overview"
proportion: 50/50
---
**Structure:**

1. Initialize parameters (randomly or via K-means)
2. **E-step:** compute point-to-cluster probabilities
3. **M-step:** update parameters to maximize likelihood
4. Repeat until convergence

<!-- split -->

**Parallel with K-Means:**

| K-Means | EM |
|---|---|
| Assign to nearest centroid | E-step: compute probabilities |
| Recompute centroid mean | M-step: update μ, σ, priors |
| Hard assignment | Soft (probabilistic) assignment |
---
layout: content
title: "E-Step: Expectation"
---
For each point $x_i$, compute the posterior probability it belongs to cluster $C_j$ using Bayes' Rule:

$$p(C_j \mid x_i) = \frac{p(x_i \mid C_j)\;\cdot\;p(C_j)}{\displaystyle\sum_{l=1}^{k} p(x_i \mid C_l)\;\cdot\;p(C_l)}$$

- $p(x_i \mid C_j)$ — likelihood under the Gaussian for cluster *j*
- $p(C_j)$ — prior probability (weight) of cluster *j*
- These posteriors play the role of the weights $w_{ij}$ in fuzzy c-means
---
layout: content
title: "M-Step: Maximization"
---
Given probabilities from E-step, update centroid and cluster prior:

**Centroid update:**

$$c_j = \frac{\displaystyle\sum_{i=1}^{m} x_i \cdot p(C_j \mid x_i)}{\displaystyle\sum_{i=1}^{m} p(C_j \mid x_i)}$$

**Prior update:**

$$p(C_j) = \frac{1}{m} \sum_{i=1}^{m} p(C_j \mid x_i)$$
---
