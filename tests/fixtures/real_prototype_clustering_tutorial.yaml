layout: comparison
title: "Issues with SOM"
---
**Limitations**

- High computational complexity
- No guarantee of convergence
- Grid shape and size are arbitrary choices
- No explicit objective function to optimize

<!-- split -->

**When to Use**

- Exploratory visualization of high-dimensional data
- When topology of clusters matters
- Document or image clustering with interpretable grids
---
layout: summary
title: "Summary"
---
| Method | Assignment | Key Strength | Key Weakness |
|---|---|---|---|
| K-Means | Hard | Fast, simple | Spherical clusters only |
| Fuzzy C-Means | Soft (weight) | Captures overlap | Fuzziness param *p* to tune |
| EM (Gaussian) | Probabilistic | Elliptical shapes, uncertainty | Local optima, O(d²) params |
| SOM | Hard + topology | Topology-preserving map | No objective function |

**Final Checkpoint:** For overlapping clusters in genomics data, which method would you choose first, and why?
