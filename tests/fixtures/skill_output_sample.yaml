title: DBSCAN vs OPTICS
proportion: 50/50
left:
  type: diagram
  alt_text: "Diagram placeholder for left column"
---
**DBSCAN**: Fixed ε parameter, binary density threshold. Works well when clusters have similar density.

<!-- split -->

**OPTICS**: Variable density detection, produces reachability plot. Handles clusters with varying density levels.

---
layout: steps
title: DBSCAN Algorithm Steps
---
1. **Initialize**: Mark all points as unvisited
2. **Select Point**: Pick an unvisited point p
3. **Expand Cluster**: If p is core, create cluster and add all density-reachable points
4. **Repeat**: Continue until all points visited

---
layout: code
title: DBSCAN Implementation
language: python
---
```python
from sklearn.cluster import DBSCAN
import numpy as np

X = np.array([[1, 2], [2, 2], [2, 3], [8, 7], [8, 8], [25, 80]])
clustering = DBSCAN(eps=3, min_samples=2).fit(X)
print(clustering.labels_)  # [-1, 0, 0, 1, 1, -1]
```

---
layout: comparison
title: Method Comparison
---
**Advantages**
- No need to specify number of clusters
- Finds arbitrarily shaped clusters
- Robust to outliers (labels them as noise)
- Deterministic results

<!-- split -->

**Limitations**
- Sensitive to ε and MinPts parameters
- Struggles with varying density clusters
- High dimensionality reduces effectiveness
- Not suitable for very large datasets without indexing

