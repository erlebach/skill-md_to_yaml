A cluster is defined as a maximal set of density-connected points.

---
layout: summary
title: Key Takeaways
---
- Density-based clustering discovers arbitrary-shape clusters without specifying k
- DBSCAN is the foundational algorithm; OPTICS extends it for varying densities
- Parameter selection (ε, MinPts) is critical — use k-distance graphs for guidance
- Best suited for spatial data and datasets with noise
