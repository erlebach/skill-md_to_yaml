---
layout: hero
title: Why Density-Based Methods?
---
Traditional partitioning methods like K-Means assume spherical clusters. Density-based methods discover clusters of **arbitrary shape** by identifying regions of high point density separated by low-density regions.

---
layout: content
title: Core Concepts
---
- **Epsilon (ε)**: Radius defining the neighborhood of a point
- **MinPts**: Minimum number of points required to form a dense region
- **Core point**: Has ≥ MinPts neighbors within ε-radius
- **Border point**: Within ε of a core point but fewer than MinPts neighbors

