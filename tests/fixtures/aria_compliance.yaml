layout: summary
title: Key Takeaways
---
- Accessibility is a continuous process, not a one-time fix
- Automated tools catch roughly 30% of issues
- Manual testing with assistive technology is essential
- Semantic HTML reduces the need for ARIA attributes
- Every team member shares responsibility for accessibility
