layout: comparison
title: Accessible vs Inaccessible
---
**Accessible Design**

- Semantic HTML elements
- Sufficient color contrast
- Keyboard navigation support
- Screen reader compatibility

<!-- split -->

**Inaccessible Design**

- Divs and spans for everything
- Low contrast text
- Mouse-only interactions
- No ARIA labels
---
layout: steps
title: Accessibility Audit Process
---
1. Run automated scanning tools (axe, Lighthouse, Siteimprove)
2. Perform manual keyboard navigation testing
3. Test with at least two screen readers
4. Verify color contrast ratios with a contrast checker
5. Review heading hierarchy and landmark structure
6. Document findings and prioritize fixes
