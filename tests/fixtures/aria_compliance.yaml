---
layout: content
title: Bullet Points
---
Key accessibility principles:

- **Perceivable** — information must be presentable in ways users can perceive
- **Operable** — UI components must be operable by all users
- **Understandable** — information and UI operation must be understandable
- **Robust** — content must be robust enough for assistive technologies
---
layout: content
title: Nested Lists and Emphasis
---
Approaches to accessible design:

1. Start with **semantic HTML**
2. Add ARIA only when native semantics are insufficient
3. Test with real assistive technology

Additional considerations:

- Screen readers interpret *emphasis* differently
- Links must have **descriptive text**, not "click here"
- Color alone must not convey meaning
