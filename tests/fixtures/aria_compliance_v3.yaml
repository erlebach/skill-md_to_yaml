layout: content
title: Zero Trust Network Model
---
Every request is authenticated and authorized regardless of network location:

$$P(\text{access}) = \prod_{i=1}^{n} P(\text{policy}_i \mid \text{context})$$

Identity verification uses mutual TLS with short-lived certificates:

$$\text{cert\_lifetime} = \min(T_{rotation}, T_{max}) = \min(1h, 24h) = 1h$$
