layout: content
title: Error Budget Policy
---
Error budget consumption triggers escalating responses:

- **< 50% consumed** — normal development velocity, deploy at will
- **50–75% consumed** — increased review rigor, no risky deployments on Fridays
- **75–90% consumed** — feature freeze, focus on reliability improvements
- **> 90% consumed** — full incident response mode, rollback recent changes

Monthly burn rate: $B = 1 - \frac{A_{actual}}{A_{target}}$

Where $A_{actual}$ is measured availability and $A_{target}$ is the SLA target.
