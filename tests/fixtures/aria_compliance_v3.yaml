layout: code
title: Distributed Tracing Setup
language: python
---
```python
from opentelemetry import trace
from opentelemetry.sdk.trace import TracerProvider
from opentelemetry.sdk.trace.export import BatchSpanProcessor
from opentelemetry.exporter.jaeger.thrift import JaegerExporter

provider = TracerProvider()
jaeger = JaegerExporter(
    agent_host_name="jaeger-agent.observability.svc",
    agent_port=6831,
)
provider.add_span_processor(BatchSpanProcessor(jaeger))
trace.set_tracer_provider(provider)

tracer = trace.get_tracer("order-service")

async def process_order(order_id: str):
    with tracer.start_as_current_span("process_order") as span:
        span.set_attribute("order.id", order_id)
        await validate_inventory(order_id)
        await charge_payment(order_id)
        await send_confirmation(order_id)
```
