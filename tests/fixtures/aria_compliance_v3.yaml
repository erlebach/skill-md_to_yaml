---
layout: divider
title: Migration Strategy
---
---
layout: steps
title: Strangler Fig Pattern
---
1. Deploy API gateway in front of the monolith as a routing layer
2. Extract authentication into a standalone service behind the gateway
3. Gradually route traffic to new services while maintaining monolith fallback
4. Implement event sourcing for cross-service communication
5. Migrate database schemas to per-service databases using CDC
6. Decommission monolith components as each service proves stable
---
layout: comparison
title: Lift-and-Shift vs Re-architecture
---
**Lift-and-Shift**

- Timeline: 3 months
- Risk: Low
- No code changes required
- Same scalability limitations
- Quick win for compliance

<!-- split -->

**Re-architecture**

- Timeline: 12 months
- Risk: Medium-High
- Enables auto-scaling per service
- Independent deployment cycles
- Long-term cost optimization
