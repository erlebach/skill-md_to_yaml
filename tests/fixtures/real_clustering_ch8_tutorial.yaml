layout: diagram
title: "Dense versus Sparse Gaussian Clustering"
alt_text: "Two-panel diagram contrasting Gaussian mixture covariance parameterizations. Left panel shows a rotated ellipse labeled Dense (full covariance matrix, O(k d squared) parameters, flexible ellipses capturing feature correlations). Right panel shows an axis-aligned thinner ellipse labeled Sparse (diagonal covariance, O(k d) parameters, trading flexibility for speed)."
---
Dense models pair each cluster with a full covariance matrix; sparse models share structure
(diagonal/spherical) to cut parameters. EM with full covariances needs far more parameters
than k-means, which only tracks means.
---
layout: comparison
title: "Pros and Cons of EM for Clustering"
---
**Helpful**

- Soft assignments with principled probabilistic story.
- Extends to elliptical clusters when covariances are estimated.
- Compact model you can sample or score new points against.

<!-- split -->

**Watch outs**

- Convergence can be slow; only local optima are guaranteed.
- Needs distributional assumptions (e.g., Gaussian components).
- Full covariance cost grows as $O(d^2)$ per component.
---
layout: content
title: "Alternatives When EM Is the Wrong Tool"
---
- Method-of-moments / spectral estimators — see the ICML 2014 moments workshop bibliography.
- MCMC and other Bayesian inference approaches when you need uncertainty beyond a point estimate.
- Hybrid pipelines: use k-means or fuzzy methods for initialization or speed, then refine selectively.
