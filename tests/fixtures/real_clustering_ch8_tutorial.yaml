---
layout: content
title: "Fuzzy c-Means Objective"
---
Introduce a fuzziness exponent **p ≥ 1** to control overlap:

$$J = \sum_{i=1}^{m} \sum_{j=1}^{k} w_{ij}^p \cdot \text{dist}(x_i, c_j)^2 \qquad \sum_{j=1}^{k} w_{ij} = 1$$

- Exponent *p* > 1 controls fuzziness (not a superscript on distance).
- Weights stay in [0,1] and sum to 1 per point.
- Reference: Bezdek (1981), *Pattern recognition with fuzzy objective function algorithms*.
