layout: divider
title: Soft Clustering Foundations
---

---
layout: content
title: "Hard (Crisp) versus Soft (Fuzzy) Clustering"
---
- **Hard:** each point belongs to exactly one cluster.
- **Soft:** points split membership across clusters using weights.
- Start from the same idea as k-means: minimize weighted squared error to centroids.
---
layout: content
title: "Weighted SSE Template"
---
Alternate between two steps to minimize weighted SSE:

$$\text{SSE} = \sum_{j=1}^{k} \sum_{i=1}^{m} w_{ij} \cdot \text{dist}(x_i, c_j)^2 \qquad \text{subject to} \sum_{j=1}^{k} w_{ij} = 1$$

- Fix centroids → assign weights; fix weights → recompute centroids.
- Hard clustering sets each $w_{ij}$ to 0 or 1.
