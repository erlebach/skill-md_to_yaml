---
layout: content
title: "Self-Organizing Maps (SOM)"
---
- Still specify *k* prototypes, but arrange them on a grid so neighbors matter.
- Present points one at a time (online flavor); find the best-matching unit.
- Update the winner **and** nearby prototypes using a neighborhood kernel that shrinks over time.
- Reference: Kohonen's *Self-Organizing Maps* (Springer series in information sciences).
