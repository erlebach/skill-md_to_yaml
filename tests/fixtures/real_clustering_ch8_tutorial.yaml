layout: content
title: "Issues Called Out in the Lecture"
---
- Training cost is high for large grids and long schedules.
- No global convergence certificate — monitor stability empirically.
- Grid size, neighborhood widths, and learning rates are partly manual design choices.
- Unlike k-means or EM, there is no single closed-form objective to monitor universally.
