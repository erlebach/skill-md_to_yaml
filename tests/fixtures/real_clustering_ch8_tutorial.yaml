layout: divider
title: Probabilistic Clustering
---

---
layout: content
title: "Clustering with Mixture Models"
---
- Treat data as samples from a **mixture** of distributions (often Gaussians).
- Clusters appear when you estimate each component's parameters (means, covariances, mixing weights).
- EM implements this estimation; k-means is a limiting case for spherical, equal-variance assignments.
- Posterior membership probabilities play the same role as fuzzy weights.
---
layout: figure
title: "Probabilistic Clustering Intuition"
src: clustering-ch8-tutorial-opus46-2026-03-20_2008-assets/_page_5_Figure_2.jpeg
alt_text: "Histogram of one-dimensional data with two overlaid bell-shaped component densities. Histogram bars show frequency with two pronounced modes; curves overlaid suggest each mode is modeled by a Gaussian, yielding per-point probabilities of belonging to each component."
---
Assign each point to the component with highest posterior probability once parameters are known.
---
layout: steps
title: "EM Algorithm — Narrated Loop"
---
1. Initialize mixture parameters Θ.
2. **Repeat:** compute each point's probability under every component; update parameters to maximize expected complete-data likelihood.
3. **Stop** when parameters stabilize (matches assignment/update rhythm of k-means).

- Random starts risk local minima; Gaussian mixtures often warm-start from k-means.
- Full covariances capture elongated clusters, not just spheres.
---
layout: content
title: "Updating Centroids with Responsibilities"
---
Centroid update uses posterior probabilities as weights:

$$c_j = \frac{\sum_{i=1}^{m} x_i \, p(C_j \mid x_i)}{\sum_{i=1}^{m} p(C_j \mid x_i)}$$

- Matches fuzzy averaging, but weights are **probabilities** from Bayes' rule, not raised to *p*.
- Mixing proportions $p(C_j)$ estimated by averaging posteriors across points.
---
layout: content
title: "Algorithm 9.2 in the Textbook"
---
- **Expectation:** compute $p(\text{component } j \mid x_i, \Theta)$ for every point.
- **Maximization:** refresh Θ to increase expected log-likelihood.
- Iterate until parameters change less than a tolerance (same spirit as k-means convergence checks).
