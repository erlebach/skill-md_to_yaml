layout: content
title: "SOM as Dimensionality Reduction"
---
- 2D grids yield interpretable heatmaps of where each prototype lives.
- Neighborhood smoothing acts like a structural prior on how clusters relate.
- Pair with UMAP/t-SNE only if you need a separate nonlinear view — SOM already embeds topology.
