      E --> G{All Green?}
      G -->|Yes| H[Deploy to Staging]
      G -->|No| F
      H --> I[Deploy to Production]
---
CI/CD pipeline best practices:

- **Automated builds** trigger on every commit to main
- **Unit tests** run in parallel for fast feedback
- **Integration tests** validate cross-service contracts
- Failed tests immediately notify the responsible developer
- **Staging deployment** mirrors production for final validation
- Production deploys use blue-green or canary strategies

