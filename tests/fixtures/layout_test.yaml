---
Key paradigm transitions:

- **Classical transformers** face $O(N^2)$ computational bottleneck
- **PQC-based paradigm** uses parameterized quantum circuits for near-term hardware
- **QLA-based paradigm** targets fault-tolerant quantum era
- Quantum pairwise and holistic attention mechanisms replace classical self-attention
- Open questions remain on scalability and genuine algorithmic speedup

