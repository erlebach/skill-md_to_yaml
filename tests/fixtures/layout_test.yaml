Data model design decisions:

- **Users** can place multiple orders and write reviews
- **Orders** contain one or more products (many-to-many)
- **Reviews** link both to users and products for accountability
- All entities use integer primary keys for indexing performance
- Timestamps on orders enable time-series analytics
- Price stored as float on products; totals computed at order time
