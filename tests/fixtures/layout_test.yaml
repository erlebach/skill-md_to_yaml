Transformer block components:

- **Self-Attention** computes query-key-value mappings
- **Add & Norm** layers stabilize gradient flow via residual connections
- **Feed Forward** network applies non-linear transformations per position
- Attention scores determine how tokens relate to each other
- Weighted value aggregation produces context-aware representations

