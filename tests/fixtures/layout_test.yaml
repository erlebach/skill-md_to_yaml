layout: content
title: Compressible Navier-Stokes Equations
---
The compressible Navier-Stokes equations govern viscous, heat-conducting fluid flow:

**Conservation of mass (continuity):**

$$\frac{\partial \rho}{\partial t} + \nabla \cdot (\rho \mathbf{u}) = 0$$

**Conservation of momentum:**

$$\frac{\partial (\rho \mathbf{u})}{\partial t} + \nabla \cdot (\rho \mathbf{u} \otimes \mathbf{u}) = -\nabla p + \nabla \cdot \boldsymbol{\tau} + \rho \mathbf{f}$$

where the viscous stress tensor is:

$$\boldsymbol{\tau} = \mu \left( \nabla \mathbf{u} + (\nabla \mathbf{u})^T - \frac{2}{3} (\nabla \cdot \mathbf{u}) \mathbf{I} \right)$$

**Conservation of energy:**

$$\frac{\partial (\rho E)}{\partial t} + \nabla \cdot \left[ (\rho E + p) \mathbf{u} \right] = \nabla \cdot (\boldsymbol{\tau} \cdot \mathbf{u}) + \nabla \cdot (k \nabla T) + \rho \mathbf{f} \cdot \mathbf{u}$$

Closed by the equation of state $p = \rho R T$ and Fourier's law $\mathbf{q} = -k \nabla T$.

