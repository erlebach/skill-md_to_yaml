layout: content
title: Challenges and Open Problems
---
Quantum transformers face significant theoretical and engineering challenges:

- **Barren plateaus:** Gradients vanish exponentially with qubit count in deep PQCs. Mitigation: local cost functions, shallow circuits, layer-wise training.
- **Qubit limitations:** Current NISQ devices offer 50-1000 noisy qubits. Encoding even modest sequence lengths requires careful compression.
- **Noise and decoherence:** Gate errors (0.1-1%) and T1/T2 decoherence times limit circuit depth.
- **Measurement overhead:** Each expectation value requires O(1/epsilon^2) shots for precision epsilon.
- **Classical-quantum bottleneck:** Data transfer between classical preprocessing and quantum circuits introduces latency.
- **Lack of proven advantage:** No quantum transformer has demonstrated provable speedup over classical transformers on practical NLP tasks.

| Challenge | Approach | Status |
|---|---|---|
| Barren plateaus | Identity-block init, local cost functions | Promising |
| Qubit count | Amplitude encoding, patch-based input | Active |
| Noise | Error mitigation, dynamical decoupling | Hardware-dependent |
| Measurement | Classical shadows, grouped Pauli | 10-100x reduction |
| Speed | Tensor network simulation, GPU simulators | Dev/testing |
