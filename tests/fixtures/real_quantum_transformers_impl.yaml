layout: two-column
title: Layer Normalization
proportion: 50/50
---
**Post-norm (original):**

`output = LayerNorm(x + SubLayer(x))`

Normalizes after the addition. Can cause training instability with deep quantum circuits.

**Pre-norm (recommended):**

`output = x + SubLayer(LayerNorm(x))`

Normalizes before the quantum circuit, ensuring inputs to the PQC are well-conditioned.

| Property | Post-norm | Pre-norm |
|---|---|---|
| Gradient stability | Can degrade | Stable |
| Quantum input | Unnormalized | Normalized |
| Convergence | Slower | Faster |

<!-- split -->

```python
class PreNormQuantumBlock(nn.Module):
    """Pre-norm: normalize before quantum circuit."""
    def __init__(self, dim, quantum_layer):
        super().__init__()
        self.norm = nn.LayerNorm(dim)
        self.quantum_layer = quantum_layer

    def forward(self, x):
        return x + self.quantum_layer(self.norm(x))


class PostNormQuantumBlock(nn.Module):
    """Post-norm: normalize after residual addition."""
    def __init__(self, dim, quantum_layer):
        super().__init__()
        self.norm = nn.LayerNorm(dim)
        self.quantum_layer = quantum_layer

    def forward(self, x):
        return self.norm(x + self.quantum_layer(x))
```
