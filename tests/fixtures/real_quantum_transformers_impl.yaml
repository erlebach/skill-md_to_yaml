layout: code
title: Residual Connections in Quantum Transformers
language: python
---
```python
import torch
import torch.nn as nn

class QuantumResidualBlock(nn.Module):
    def __init__(self, dim, quantum_layer, norm_eps=1e-5):
        super().__init__()
        self.quantum_layer = quantum_layer
        self.norm = nn.LayerNorm(dim, eps=norm_eps)

    def forward(self, x):
        # Quantum sub-layer output (measured, classical tensor)
        q_out = self.quantum_layer(x)
        # Residual addition + layer normalization
        return self.norm(x + q_out)
```

Residual connections must operate on classical tensors (post-measurement), not quantum states.
