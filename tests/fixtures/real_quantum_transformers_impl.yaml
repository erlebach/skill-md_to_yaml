A Quantum Transformer replaces classical sub-layers with parameterized quantum circuits (PQCs). Input data is encoded into quantum states, processed through quantum attention and feed-forward circuits, then measured to produce classical outputs.

Key design choices:

- **Encoding strategy:** angle encoding (one qubit per feature) vs. amplitude encoding (logarithmic qubits)
- **Circuit ansatz:** hardware-efficient vs. problem-inspired (Hamiltonian-based)
- **Measurement:** Pauli-Z expectations or full tomography for output extraction
---
layout: two-column
title: Quantum Self-Attention
proportion: 60/40
---
Quantum self-attention computes attention weights by exploiting quantum superposition and entanglement. Instead of explicit Q, K, V matrix multiplications, the quantum circuit encodes input tokens into qubit registers and uses parameterized entangling gates.

**Circuit stages:**

1. **Encoding:** R_y(x_i) embeds each token feature as a rotation angle
2. **Entangling:** CNOT gates create inter-token correlations (analogous to Q*K^T)
3. **Parameterized:** trainable R_y, R_z gates learn attention weights
4. **Re-entangle:** second CNOT layer enriches expressivity
5. **Measure:** Pauli-Z expectation values yield attention-weighted outputs

<!-- split -->

**PennyLane implementation:**

```python
import pennylane as qml

n_qubits = 4
dev = qml.device("default.qubit", wires=n_qubits)

@qml.qnode(dev)
def quantum_self_attention(inputs, params):
    for i in range(n_qubits):
        qml.RY(inputs[i], wires=i)
    for i in range(0, n_qubits - 1, 2):
        qml.CNOT(wires=[i, i + 1])
    for i in range(n_qubits):
        qml.RY(params[i, 0], wires=i)
        qml.RZ(params[i, 1], wires=i)
    for i in range(1, n_qubits - 1, 2):
        qml.CNOT(wires=[i, i + 1])
    return [qml.expval(qml.PauliZ(i)) for i in range(n_qubits)]
```
