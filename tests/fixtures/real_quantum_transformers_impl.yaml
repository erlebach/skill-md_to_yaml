The Transformer architecture (Vaswani et al., 2017) replaced recurrence with self-attention, enabling parallel processing of entire sequences.

**Core equation:**

$$\text{Attention}(Q, K, V) = \text{softmax}\!\left(\frac{QK^T}{\sqrt{d_k}}\right)V$$
