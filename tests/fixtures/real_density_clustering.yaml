title: "DENCLUE: Density Landscape"
alt_text: "A 1D kernel density plot. The x-axis represents data space and y-axis represents density. Five peaks labeled A, B, C, D, and E from left to right. A horizontal dashed orange line at height xi marks the minimum density threshold. Three vertical dotted gray lines mark local minima (valleys) between peaks. Peaks A, B, and C are separated by valleys that dip below xi — they form three distinct clusters. Peak D is smaller and peak E is the tallest; the density between D and E stays above xi, so they are merged into a single cluster labeled merge(D, E)."
---
Clusters emerge from peaks of the density function. The threshold ξ acts as a "water level" — peaks above it form clusters; valleys above it merge adjacent peaks.

- Cluster A (under peak A), Cluster B (under peak B), Cluster C (under peak C)
- Cluster D+E merged: density between D and E stays above ξ throughout
