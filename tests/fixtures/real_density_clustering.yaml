layout: two-column
title: "Subspace Clustering: The Challenge"
proportion: 50/50
---
**Why All-Attribute Clustering Fails**

- High dimensionality dilutes distance measures — points seem equally far apart in all directions
- Irrelevant attributes add noise that obscures cluster structure
- Different clusters may be defined by different subsets of attributes

A **subspace** is any subset of the original attribute dimensions. Subspace clustering finds clusters that are meaningful within some — but not necessarily all — of the dimensions.

<!-- split -->

**Goals of Subspace Clustering**

- Identify *which* attributes define each cluster
- Find clusters in multiple, potentially different subspaces
- Avoid reporting "shadow" clusters — projections of higher-dimensional clusters that only appear clustered in a lower subspace

The goal is to find the clusters *and* the dimensions in which they exist — not merely projections of higher-dimensional clusters onto a lower-dimensional view.
---
layout: two-column
title: "Clusters in Subspaces"
proportion: 40/60
---
**The Key Insight**

A 3D dataset with attributes x, y, z can contain clusters that are only visible in specific 2D projections:

- One cluster visible in the x–y plane
- Another visible in the x–z plane
- A third visible in the y–z plane

The same data point can participate in *different* subspace clusters depending on which projection is examined.

Subspace clusters that appear in a lower-dimensional projection may just be "shadows" — we must verify they are genuine, not artifacts of projection.

<!-- split -->

![3D data cube with clusters in different 2D projection planes]

An isometric cube wireframe representing a 3D data space with x, y, and z axes. Blue circles cluster in the x-y face. Green triangles cluster in the x-z face. Orange squares cluster in the y-z face. Each group is clearly separated from the others by symbol and color, demonstrating that the same 3D dataset contains three distinct clusters, each visible only in a different 2D subspace.
