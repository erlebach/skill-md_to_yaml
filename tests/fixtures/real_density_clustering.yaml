layout: content
title: "When to Use Each Algorithm"
---
Each method targets a different set of scenarios. Choose based on data dimensionality, cluster shape, density variation, and interpretability needs.

| Criterion | Grid-Based | CLIQUE | DENCLUE |
|---|---|---|---|
| Cluster shape | Axis-aligned rectangles only | Axis-aligned in each subspace | Arbitrary shapes |
| High-dimensional data | Poor — grid size explodes | Good — subspace pruning | Moderate |
| Varying cluster density | Poor — one fixed τ | Poor — one fixed τ | Moderate — one ξ, but continuous density |
| Noise handling | Good — sparse cells discarded | Good — below-threshold cells pruned | Excellent — low-density points rejected as noise |
| Interpretability | Moderate — grid cells visible | Excellent — attribute-range inequalities | Moderate — density attractors |
| Best used when... | 2D–3D data, many points, speed is priority | High-dim data, subspace clusters expected | Arbitrary cluster shapes, noise matters, smooth density more natural |
---
layout: summary
title: "Summary: Density-Based Clustering Methods"
---
- **Grid-Based:** fast, simple, axis-aligned only; resolution is a key tuning challenge
- **Subspace Clustering:** addresses curse of dimensionality; clusters exist in different attribute subsets
- **CLIQUE:** uses Apriori-style monotone pruning to search subspaces efficiently; interpretable output
- **DENCLUE:** continuous kernel density estimation; handles arbitrary shapes and noise; grounded in statistical KDE theory
