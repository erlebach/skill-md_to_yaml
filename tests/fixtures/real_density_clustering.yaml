layout: two-column
title: "Grid-Based Clustering"
proportion: 50/50
---
**Core Idea**

- Divide the attribute space into a rectangular grid
- Count points per cell to estimate local density
- Cells above a density threshold τ are considered dense
- Contiguous dense cells form a cluster

Processing time depends on the number of grid cells — **not** on the number of data points.

<!-- split -->

**Trade-offs**

**Fast** — grid structure enables efficient density queries and cluster formation

**Resolution-sensitive** — coarse grids miss fine cluster structure; fine grids are expensive and noise-prone

**Axis-aligned only** — cannot detect clusters oriented at an angle to the coordinate axes
---
layout: two-column
title: "Grid-Based Algorithm: Step by Step"
proportion: 40/60
---
**Algorithm 9.4 — Basic Grid-Based Clustering**

1. **Define** a set of grid cells partitioning the attribute space
2. **Assign** each data object to its cell; compute the density (point count) of each cell
3. **Eliminate** cells with density below threshold τ
4. **Form clusters** by grouping contiguous (touching) dense cells

The algorithm is elegantly simple: discretize → count → threshold → connect. Its power lies in its speed; its weakness lies in the fixed threshold and axis-aligned structure.

<!-- split -->

![Grid density map with two clusters]

A seven-by-seven grid where most cells have a count of zero (empty). Two dense regions are highlighted. The left cluster (blue outline) spans columns 2–5, rows 3–6, with cell counts from 3 to 21. The right cluster (green outline) is a two-column by two-row block with counts of 18, 24, 27, and 31.
