layout: two-column
title: "CLIQUE: A Subspace Clustering Algorithm"
proportion: 50/50
---
**How CLIQUE Works**

- Partitions the data space into rectangular cells of equal volume across all possible subspaces
- Measures the density of each unit as the **fraction** of total data points it contains
- A cell is **dense** if its fraction of points exceeds the user-specified threshold τ
- A **cluster** is a maximal set of contiguous (touching) dense units

<!-- split -->

**Key Properties**

**Overlapping clusters** — a point may belong to clusters in multiple subspaces simultaneously

**Automatic subspace discovery** — identifies which dimensions are relevant per cluster without user guidance

**Single global threshold τ** — one density threshold applies to all clusters in all subspaces
---
layout: two-column
title: "CLIQUE: The Monotone Property"
proportion: 50/50
---
**The Monotone Property**

If a set of points *cannot* form a density-based cluster in k dimensions, then the same set of points cannot form a density-based cluster in any superset of those k dimensions.

This is identical in structure to the **Apriori principle** in association rule mining: if an itemset is infrequent, no superset can be frequent. CLIQUE applies the same pruning strategy to subspace search.

<!-- split -->

**Why This Enables Efficient Search**

- Start by finding all dense 1D regions (one per attribute)
- Generate k-D candidates *only* from (k–1)-D dense cells
- Prune any candidate whose projection into a lower subspace is not dense
- Only a small fraction of all possible subspaces need to be examined

The search grows bottom-up from 1D to higher dimensions, pruning aggressively at each level. This makes CLIQUE tractable in practice despite the exponential search space.
---
layout: two-column
title: "CLIQUE: Algorithm Pseudocode"
proportion: 40/60
---
**Steps (Algorithm 9.5)**

1. Find all dense 1D regions for each attribute
2. Set k ← 2
3. **Repeat:**
   - Generate all candidate dense k-D cells from dense (k–1)-D cells
   - Eliminate cells containing fewer than ξ points
   - Increment k ← k + 1
4. **Until** no candidate dense k-D cells remain
5. Form clusters by taking the union of all adjacent high-density cells
6. Summarize each cluster with a minimal set of inequalities describing its attribute ranges

<!-- split -->

**Key Parameters**

**τ** (density threshold) — fraction of total points a cell must contain to be considered dense

**ξ** (minimum point count) — absolute minimum points per cell; related to τ × n

**Output:** Each cluster is described as a set of attribute-range inequalities — a compact, human-readable representation of the cluster region.
---
layout: two-column
title: "CLIQUE: Strengths and Limitations"
proportion: 50/50
---
**Strengths**

- Automatically discovers relevant subspaces — no domain knowledge required
- Finds clusters in multiple, potentially overlapping subspaces
- Produces interpretable cluster descriptions (attribute-range inequalities)
- Monotone pruning makes it tractable despite the exponential search space

<!-- split -->

**Limitations**

- **Exponential worst-case complexity** — time grows exponentially with the number of dimensions, especially when many dense units survive at lower levels
- **Fixed global threshold** — a single τ cannot accommodate clusters with widely differing densities
- **Parameter sensitivity** — threshold τ and grid interval length are difficult to tune; small changes can dramatically alter results
- **Axis-aligned only** — cannot detect clusters with boundaries not parallel to coordinate axes

The fixed threshold is CLIQUE's primary weakness. Clusters with different local densities require different thresholds, but CLIQUE uses one global value for all subspaces.
---
layout: two-column
title: "DENCLUE: Kernel Density Estimation"
proportion: 50/50
---
**Core Principle**

- Each data point contributes to the density at every location in space via an **influence function** (kernel)
- The overall density is the **sum of all kernel contributions** from all data points
- This creates a smooth landscape with peaks, saddle points, and valleys

Instead of arbitrary grid boundaries, DENCLUE estimates a principled, smooth density surface — avoiding both the resolution problem and the boundary effects of grid-based methods.

<!-- split -->

**Advantages Over Grid-Based Methods**

- No grid resolution parameter — density is continuous
- Works with arbitrary cluster shapes (not just axis-aligned rectangles)
- Grounded in kernel density estimation (KDE) — a well-studied statistical framework
- Handles noise explicitly through a minimum density threshold

The Gaussian kernel is the standard choice — it is smooth, symmetric, and its bandwidth parameter σ has an intuitive interpretation as the "radius of influence" of each point.
---
layout: two-column
title: "DENCLUE: The Gaussian Kernel"
proportion: 40/60
---
**Kernel Function**

$$K(y) = \exp\!\left(-\frac{\text{distance}(\mathbf{x}, \mathbf{y})^2}{2\sigma^2}\right)$$

Maximum influence (value 1) at the data point itself, decaying exponentially with distance. σ (bandwidth) controls how far the influence extends.

When σ is large, each point has broad influence — the density surface is smooth and peaks are wide. When σ is small, influence is concentrated — the surface is spiky and reveals fine structure.

<!-- split -->

**Total Density Function**

The density at any point y is the sum of kernel contributions from all n data points:

$$f(y) = \sum_{i=1}^{n} K(x_i, y)$$

- Local maxima of f(y) are density attractors — cluster centers
- Saddle points and valleys separate different clusters
- Global density depends on the bandwidth σ
---
layout: two-column
title: "DENCLUE Algorithm: Three Steps"
proportion: 50/50
---
**Step 1: Estimate the Density Function**

Compute f(y) by summing Gaussian kernels centered at each data point. This produces a continuous density landscape over the entire data space.

**Step 2: Find Density Attractors**

Identify all local maxima of f(y). These peaks are the **density attractors**. Each data point is assigned to its nearest attractor by following the direction of maximum density increase (gradient ascent).

**Step 3: Form and Filter Clusters**

- Discard attractors whose peak density is below the minimum threshold ξ — they are treated as noise
- Merge attractors whose connecting path maintains density above ξ throughout
- Each remaining attractor (or merged group) defines one cluster

<!-- split -->

**Gradient Ascent Assignment**

Each data point climbs the density gradient until it reaches a local maximum. The attractor it reaches determines its cluster membership.

If a point's density at its starting location is below ξ, it is classified as **noise** and rejected — no cluster assignment is made.

Two attractors D and E are **merged** into one cluster if there exists a path between them where the density never falls below ξ — they are connected through a high-density region.
---
