from prometheus_client import Histogram, Counter, Gauge

prediction_latency = Histogram(
    "model_prediction_seconds",
    "Prediction latency",
    buckets=[0.001, 0.005, 0.01, 0.025, 0.05, 0.1],
)

drift_score = Gauge(
    "feature_drift_score",
    "PSI drift score per feature",
    ["feature_name"],
)

def monitor_prediction(features, prediction, latency):
    prediction_latency.observe(latency)
    for name, value in features.items():
        drift_score.labels(feature_name=name).set(
            calculate_psi(reference[name], value)
        )
```
---
layout: content
title: Gradient Flow Analysis
---
Monitoring gradient norms during fine-tuning:

$$\|\nabla_\theta \mathcal{L}\|_2 = \sqrt{\sum_{i} \left(\frac{\partial \mathcal{L}}{\partial \theta_i}\right)^2}$$

We clip gradients when the norm exceeds threshold $\tau$:

$$\hat{g} = \begin{cases} g & \text{if } \|g\|_2 \leq \tau \\ \tau \cdot \frac{g}{\|g\|_2} & \text{otherwise} \end{cases}$$

Learning rate schedule follows cosine annealing:

$$\eta_t = \eta_{min} + \frac{1}{2}(\eta_{max} - \eta_{min})\left(1 + \cos\left(\frac{t \cdot \pi}{T}\right)\right)$$
