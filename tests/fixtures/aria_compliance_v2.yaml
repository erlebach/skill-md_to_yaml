layout: comparison
title: Batch vs Real-Time Inference
---
**Batch Inference**

- Scheduled hourly via Airflow DAGs
- Processes full customer base overnight
- Results cached in Redis for fast lookup
- Cost: $0.002 per 1K predictions

<!-- split -->

**Real-Time Inference**

- Sub-10ms latency requirement
- Kubernetes autoscaling (3–20 pods)
- Feature store lookup at request time
- Cost: $0.008 per 1K predictions
---
layout: code
title: Rollback Procedure
language: bash
---
```bash
#!/usr/bin/env bash
set -euo pipefail

MODEL_NAME="fraud-detector"
PREV_VERSION=$(kubectl get inferenceservice "$MODEL_NAME" \
  -o jsonpath='{.metadata.annotations.previous-version}')

echo "Rolling back $MODEL_NAME to version $PREV_VERSION"

kubectl patch inferenceservice "$MODEL_NAME" \
  --type=merge \
  -p "{\"spec\":{\"predictor\":{\"model\":{\"storageUri\":\"gs://models/${MODEL_NAME}-${PREV_VERSION}\"}}}}"

kubectl rollout status deployment "${MODEL_NAME}-predictor" --timeout=120s
echo "Rollback complete. Verifying health..."
curl -sf "http://localhost:8080/v1/models/${MODEL_NAME}" | jq .status
```
