---
layout: content
title: Data Sources Overview
---
Our pipeline ingests from three primary sources:

- **Transactional DB** — PostgreSQL with 2.3B rows, updated hourly
- **Event stream** — Kafka topics producing ~50K events/sec
- **External APIs** — weather, census, and market data feeds

Each source requires a dedicated connector with retry logic and schema validation.
---
layout: steps
title: ETL Pipeline Stages
---
1. Extract raw data from source systems via CDC connectors
2. Land in object storage as partitioned Parquet files
3. Apply schema evolution checks against the registry
4. Run data quality gates (nulls, ranges, distributions)
5. Transform and join into feature-ready datasets
