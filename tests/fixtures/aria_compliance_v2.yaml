layout: content
title: A/B Testing Framework
---
Statistical significance is computed using a two-proportion z-test:

$$z = \frac{\hat{p}_1 - \hat{p}_2}{\sqrt{\hat{p}(1-\hat{p})\left(\frac{1}{n_1} + \frac{1}{n_2}\right)}}$$

Where $\hat{p}$ is the pooled proportion. We require:

- Minimum detectable effect: **0.5%** absolute lift
- Statistical power: **80%** ($\beta = 0.2$)
- Significance level: **5%** ($\alpha = 0.05$)
