layout: steps
title: Incident Response Protocol
---
1. Automated alert fires when drift score exceeds 0.2 PSI threshold
2. On-call engineer acknowledges within 15 minutes
3. Run diagnostic notebook to identify affected features
4. If data issue: trigger backfill pipeline and notify upstream team
5. If model degradation: promote shadow model or rollback to previous version
6. Post-incident review within 48 hours with root cause analysis
