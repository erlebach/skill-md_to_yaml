---
layout: content
title: Loss Function
---
We use a modified cross-entropy loss with class weights:

$$\mathcal{L} = -\sum_{i=1}^{N} w_{y_i} \left[ y_i \log(\hat{y}_i) + (1 - y_i) \log(1 - \hat{y}_i) \right]$$

Where the class weight $w_c$ compensates for imbalance:

$$w_c = \frac{N}{K \cdot n_c}$$

With $N$ total samples, $K$ classes, and $n_c$ samples in class $c$.
