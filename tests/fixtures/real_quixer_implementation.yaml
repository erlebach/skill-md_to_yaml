layout: steps
title: "Mathematics: Unitary Token Embedding"
---
Classical transformers embed tokens as dense vectors in real-valued space. Quixer maps each token to a unitary quantum gate, embedding meaning into the structure of quantum operations.

**Embedding procedure:**

1. Start with a classical embedding vector for token `w`, producing angles via a learned mapping.
2. Use these angles to parameterize a unitary circuit, producing gate `U_w`.
3. Each vocabulary token gets a unique unitary matrix representation.

$$w \rightarrow \text{angles}(\theta) \rightarrow U_w(\theta) \in U(2^n)$$

Each token `w` is mapped to rotation angles theta, which parameterize a unitary gate `U_w` in the unitary group of dimension 2 to the n. Because unitaries preserve norm and are invertible, the embedding inherently maintains quantum coherence.
---
layout: two-column
title: "Mathematics: Linear Combination of Unitaries"
proportion: 50/50
---
In classical attention, the output is a weighted sum of value vectors. Quixer achieves analogous mixing using the LCU primitive:

$$A = \sum_j \alpha_j \cdot U_{w_j}$$

Key properties:

- The coefficients `alpha_j` are **complex-valued** and trainable — encoding both magnitude and phase (interference patterns).
- The result `A` is generally **not unitary** — it is a general linear operator, essential for expressivity.
- LCU is implemented using ancilla qubits that prepare a superposition state encoding the coefficients.

<!-- split -->

**LCU circuit:**

Ancilla register (top wire, initialized to |0>) receives gate B (Prepare alpha) to create a superposition encoding the complex coefficients. Controlled-U gates (U_w1, U_w2, ...) apply each token's unitary to the System register (bottom wire, |psi>) conditioned on the ancilla state. Gate B-dagger (Unprepare) uncomputes the ancilla. Measurement M post-selects on the zero state. When post-selection succeeds, the system register contains A|psi>.
---
layout: content
title: "Mathematics: QSVT Non-linearity"
---
Classical transformers use softmax and layer normalization for non-linearity. Quixer uses Quantum Singular Value Transformation (QSVT) to apply arbitrary polynomial functions to the singular values of the mixed operator.

Given the mixed operator `A` with SVD `A = W Sigma V†`, QSVT applies a polynomial `P` to each singular value:

$$\text{QSVT}(A, P) = W \cdot P(\Sigma) \cdot V^\dagger$$

**Why this matters for attention:**

- **Degree-2 polynomial:** captures pairwise interactions between all token pairs (skip-bigrams) in a single quantum step.
- **Degree-k polynomial:** captures k-token interactions, enabling higher-order reasoning without additional circuit depth proportional to k.
- The polynomial coefficients are determined by **phase angles** — trainable parameters of the model.

> QSVT requires fault-tolerant quantum hardware. On NISQ devices, the circuit depth for useful polynomial degrees may exceed coherence times.
