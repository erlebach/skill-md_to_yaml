    end
    IN([Qubits q0, q1, q2]) --> R
    C --> OUT([Output state Q, K, or V])

Each unitary transformation in Quixer is implemented as a PQC — alternating layers of single-qubit rotations and entangling gates.

For `n` qubits and `L` layers, the total parameter count is `3 x n x L` per PQC unit.
---
layout: diagram
title: "Circuit: The Swap Test"
alt_text: "Flow diagram of the Swap Test: an ancilla qubit initialized to zero passes through a Hadamard gate, then a controlled SWAP gate that also receives the Query state Q_i and Key state K_j, then a second Hadamard gate, then measurement. The probability of measuring zero equals one half plus one half times the squared overlap of Q and K."
---
flowchart LR
    A([Ancilla in state 0]) --> H1[Hadamard H]
    H1 --> CS[Controlled SWAP]
    CS --> H2[Hadamard H]
    H2 --> M[Measure ancilla]
    Q([Query state Q_i]) --> CS
    K([Key state K_j]) --> CS

The Swap Test computes token similarity by measuring the overlap between two quantum states:

$$P(0) = \frac{1}{2} + \frac{1}{2}\left|\langle Q_i | K_j \rangle\right|^2$$

The probability of measuring the ancilla as zero gives the attention logit — the quantum analogue of the dot-product attention score.
