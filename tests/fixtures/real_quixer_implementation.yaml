layout: diagram
title: "Circuit: Parameterized Quantum Circuit Unit"
alt_text: "PQC unit circuit on 3 qubits (q0, q1, q2). Each qubit has three rotation gates Rz, Ry, Rz (blue boxes) forming the rotation layer. Then CNOT gates entangle qubits in a ring topology: q0 controls q1, q1 controls q2, q2 controls q0. A dashed orange vertical line indicates this combined rotation+entanglement layer is repeated L times. Output produces |Q>, |K>, or |V> states."
---
Each unitary transformation in Quixer is implemented as a PQC — alternating layers of single-qubit rotations and entangling gates.

For `n` qubits and `L` layers, the total parameter count is `3 x n x L` per PQC unit.
---
layout: diagram
title: "Circuit: The Swap Test"
alt_text: "Three-wire quantum circuit for the Swap Test. Top wire: ancilla |0> with Hadamard gate H, then control dot on CSWAP (Fredkin) gate connecting to middle and bottom wires, then second Hadamard H, then measurement M. Middle wire: Query state |Q_i>. Bottom wire: Key state |K_j>. SWAP targets shown as X marks on Query and Key wires. Result: P(0) = 1/2 + 1/2|<Q|K>|^2."
---
The Swap Test computes token similarity by measuring the overlap between two quantum states:

$$P(0) = \frac{1}{2} + \frac{1}{2}\left|\langle Q_i | K_j \rangle\right|^2$$

The probability of measuring the ancilla as zero gives the attention logit — the quantum analogue of the dot-product attention score.
