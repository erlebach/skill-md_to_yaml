layout: steps
title: "Intuition: What Quixer Does"
---
Classical self-attention computes pairwise token similarities and produces weighted sums of value vectors. Quixer replaces this with quantum primitives that mix information across the entire sequence holistically.

**The core idea in three steps:**

1. **Encode tokens as quantum gates.** Each word in the vocabulary becomes a unitary matrix — a quantum operation rather than a static vector. This embeds meaning into the structure of quantum transformations.
2. **Mix all tokens simultaneously.** Using a Linear Combination of Unitaries (LCU), Quixer creates a superposition of all token gates at once. Trainable complex coefficients control each token's contribution — analogous to attention weights.
3. **Apply non-linear transformations.** Quantum Singular Value Transformation (QSVT) applies polynomial functions to the mixed state's singular values, enabling the model to capture multi-token interactions in a single quantum operation.
