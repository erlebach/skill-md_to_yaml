layout: comparison
title: Pros and Cons
---
**Advantages:**

- **Holistic mixing:** all tokens interact simultaneously via LCU superposition
- **Higher-order interactions:** QSVT enables skip-k-grams in a single quantum step
- **Complex weights in an exponential space:** trainable complex coefficients leverage quantum interference across the 2^n-dimensional Hilbert space of n qubits
- **Theoretical speedup:** inner-product via Swap Test reduces per-pair complexity from O(d) to O(1)

<!-- split -->

**Disadvantages:**

- **Hardware requirements:** QSVT demands fault-tolerant quantum computers not yet available at scale
- **Measurement overhead:** LCU post-selection on ancilla measurements succeeds only probabilistically, and extracting classical information requires many shots
- **Training complexity:** hybrid quantum-classical optimization is slow; barren plateaus may arise
- **Limited empirical validation:** Quixer demonstrated only on small-scale simulations
---
layout: summary
title: Conclusions
---
Quixer demonstrates a principled approach to quantum self-attention that goes beyond simply porting classical operations to quantum hardware.

**Key takeaways:**

- **Quantum-native design:** LCU handles mixing, QSVT handles non-linearity, PQCs handle parameterized transformations
- **Composable primitives:** each component can be improved independently
- **Scalability path:** on fault-tolerant hardware, QSVT provides a polynomial-degree knob for controlling interaction complexity
- **Near-term alternatives exist:** PQC-based approaches with Swap Tests provide a simpler path for NISQ devices

| Approach | Hardware era | Attention mechanism | Complexity |
|---|---|---|---|
| PQC + Swap Test | NISQ (now) | Explicit pairwise scores | O(N^2) circuit runs |
| Quixer (LCU + QSVT) | Fault-tolerant (future) | Holistic mixing + polynomial | O(N) with degree-k |
| QCSAM (Complex LCU) | Fault-tolerant (future) | Complex-valued similarity | O(N^2) richer metrics |
