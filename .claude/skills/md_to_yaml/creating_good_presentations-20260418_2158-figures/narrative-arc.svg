<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" role="img" aria-labelledby="na-title" aria-describedby="na-desc">
  <title id="na-title">Narrative Arc: State, Illustrate, Derive</title>
  <desc id="na-desc">Circular flow showing three presentation stages: State introduces the objective, Illustrate shows a visual or example, and Derive explains significance. Arrows connect each stage in sequence forming a repeating cycle.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="420" height="320" fill="#0d1117" rx="10"/>

  <!-- State node (top center) -->
  <ellipse cx="210" cy="55" rx="68" ry="30" fill="#1a4a8a" stroke="#58a6ff" stroke-width="2"/>
  <text x="210" y="60" text-anchor="middle" fill="#e6edf3" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">Stating</text>

  <!-- Illustrate node (bottom right) -->
  <ellipse cx="330" cy="250" rx="75" ry="30" fill="#1a4a8a" stroke="#58a6ff" stroke-width="2"/>
  <text x="330" y="255" text-anchor="middle" fill="#e6edf3" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">Illustrating</text>

  <!-- Derive node (bottom left) -->
  <ellipse cx="90" cy="250" rx="68" ry="30" fill="#1a4a8a" stroke="#58a6ff" stroke-width="2"/>
  <text x="90" y="255" text-anchor="middle" fill="#e6edf3" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">Deriving</text>

  <!-- Arrow: State → Illustrate -->
  <path d="M268 72 Q370 130 318 222" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Arrow: Illustrate → Derive -->
  <path d="M258 258 L165 258" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Arrow: Derive → State -->
  <path d="M105 222 Q62 130 148 80" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Labels on arrows -->
  <text x="330" y="148" text-anchor="middle" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="12">show it</text>
  <text x="210" y="248" text-anchor="middle" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="12">why it matters</text>
  <text x="80" y="148" text-anchor="middle" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="12">next idea</text>
</svg>
