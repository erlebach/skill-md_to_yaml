[project]
name = "slide-dsl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "wcag-contrast-ratio>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "jsonschema>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
