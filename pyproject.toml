[project]
name = "slide-dsl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "wcag-contrast-ratio>=0.9",
    "latex2mathml>=3.79.0",
    "Pygments>=2.19.2",
    "Markdown>=3.10.2",
    "defusedxml>=0.7.1",
    "bleach>=6.3.0",
    "anthropic>=0.91.0",
    "openai>=2.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "jsonschema>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
